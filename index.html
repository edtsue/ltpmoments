<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LTP Moments</title>
<meta name="description" content="Cultural moments across the year, read against the target audiences you choose.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- LIGHT IS THE DEFAULT, not the system's preference. Stamped before the
     stylesheet and before anything is painted, so a reader on a dark OS does
     not get a dark board for one frame and a light one the next. Only an
     explicit choice, saved from the toggle, moves it. -->
<script>
  try {
    var t0 = localStorage.getItem('ltpm.theme');
    document.documentElement.dataset.theme = (t0 === 'dark') ? 'dark' : 'light';
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- The module's mark, in the same language as the other LTP step icons: a
     rounded tile, one silhouette, and a twenty-step long shadow clipped to the
     tile. Moments are points on a year, so the silhouette is a rule with three
     marks on it — the one that matters drawn solid, its neighbours at half. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <clipPath id="icclip"><rect width="64" height="64" rx="14.5"/></clipPath>
  <!-- Step 01's silhouette, for the mark at the foot of the rail. Drawn from
       the same file the process map draws from, so the tile a planner clicks
       here is the tile they saw on the map. -->
  <g id="icsil-brief"><path d="M20 17a3 3 0 0 1 3-3h14l9 9v24a3 3 0 0 1-3 3H23a3 3 0 0 1-3-3z"/></g>
  <g id="icsil-moments">
    <rect x="9" y="29" width="46" height="6" rx="3"/>
    <circle cx="19" cy="32" r="7"/>
    <circle cx="33.5" cy="32" r="10.5"/>
    <circle cx="48" cy="32" r="6"/>
  </g>
</defs>
<symbol id="ic-brief" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14.5" fill="#DC4B3F"/>
  <g clip-path="url(#icclip)" opacity=".2" color="#000" fill="#000">
  <use href="#icsil-brief" x="48" y="48"/>
  <use href="#icsil-brief" x="45.6" y="45.6"/>
  <use href="#icsil-brief" x="43.2" y="43.2"/>
  <use href="#icsil-brief" x="40.8" y="40.8"/>
  <use href="#icsil-brief" x="38.4" y="38.4"/>
  <use href="#icsil-brief" x="36" y="36"/>
  <use href="#icsil-brief" x="33.6" y="33.6"/>
  <use href="#icsil-brief" x="31.2" y="31.2"/>
  <use href="#icsil-brief" x="28.8" y="28.8"/>
  <use href="#icsil-brief" x="26.4" y="26.4"/>
  <use href="#icsil-brief" x="24" y="24"/>
  <use href="#icsil-brief" x="21.6" y="21.6"/>
  <use href="#icsil-brief" x="19.2" y="19.2"/>
  <use href="#icsil-brief" x="16.8" y="16.8"/>
  <use href="#icsil-brief" x="14.4" y="14.4"/>
  <use href="#icsil-brief" x="12" y="12"/>
  <use href="#icsil-brief" x="9.6" y="9.6"/>
  <use href="#icsil-brief" x="7.2" y="7.2"/>
  <use href="#icsil-brief" x="4.8" y="4.8"/>
  <use href="#icsil-brief" x="2.4" y="2.4"/>
  </g>
  <path d="M20 17a3 3 0 0 1 3-3h14l9 9v24a3 3 0 0 1-3 3H23a3 3 0 0 1-3-3z" fill="#fff"/>
  <path d="M37 14l9 9h-7a2 2 0 0 1-2-2z" fill="#C6DAFC"/>
  <path d="M27 33.5l4.5 4.5 9-10" fill="none" stroke="#1A67D2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>
<symbol id="ic-moments" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14.5" fill="#7C4DCC"/>
  <g clip-path="url(#icclip)" opacity=".2" color="#000" fill="#000">
    <use href="#icsil-moments" x="48.0" y="48.0"/>
    <use href="#icsil-moments" x="45.6" y="45.6"/>
    <use href="#icsil-moments" x="43.2" y="43.2"/>
    <use href="#icsil-moments" x="40.8" y="40.8"/>
    <use href="#icsil-moments" x="38.4" y="38.4"/>
    <use href="#icsil-moments" x="36.0" y="36.0"/>
    <use href="#icsil-moments" x="33.6" y="33.6"/>
    <use href="#icsil-moments" x="31.2" y="31.2"/>
    <use href="#icsil-moments" x="28.8" y="28.8"/>
    <use href="#icsil-moments" x="26.4" y="26.4"/>
    <use href="#icsil-moments" x="24.0" y="24.0"/>
    <use href="#icsil-moments" x="21.6" y="21.6"/>
    <use href="#icsil-moments" x="19.2" y="19.2"/>
    <use href="#icsil-moments" x="16.8" y="16.8"/>
    <use href="#icsil-moments" x="14.4" y="14.4"/>
    <use href="#icsil-moments" x="12.0" y="12.0"/>
    <use href="#icsil-moments" x="9.6" y="9.6"/>
    <use href="#icsil-moments" x="7.2" y="7.2"/>
    <use href="#icsil-moments" x="4.8" y="4.8"/>
    <use href="#icsil-moments" x="2.4" y="2.4"/>
  </g>
  <rect x="9" y="29" width="46" height="6" rx="3" fill="#fff" opacity=".5"/>
  <circle cx="19" cy="32" r="7" fill="#fff" opacity=".5"/>
  <circle cx="48" cy="32" r="6" fill="#fff" opacity=".5"/>
  <circle cx="33.5" cy="32" r="10.5" fill="#fff"/>
</symbol>
</svg>

<div class="app">
  <aside class="rail">
    <div class="rl-brand">
      <span class="rl-lg"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#ic-moments"/></svg></span>
      <span class="rl-nm">LTP Moments</span>
      <span class="modpill">6.2</span>
    </div>

    <!-- The list draws its own headings, one per group — official, popular,
         custom — so there is no single "Target audiences" heading here any
         more. See GROUPS in data/audiences.js. -->
    <div id="audList"></div>
    <p class="aud-def" id="audDef"></p>

    <div class="rl-mode" id="audMode" hidden></div>

    <!-- Pinned to the bottom of the rail, above the counts. The board argues
         with numbers, so the derivation has to be one click away from them —
         and it is drawn from the live WEIGHTS and BANDS rather than retyped,
         so it cannot drift from what the board actually computed. -->
    <button class="rl-meth" id="methBtn" type="button"
      aria-haspopup="dialog" aria-controls="meth">Methodology</button>

    <!-- Back up the process. Moments are a stage of step 02, and step 01 is
         where the objective, the dates and the RACI it answers to were agreed
         — so this is the one link off the rail, and it opens in a new tab
         because the board you are reading is the thing worth keeping. -->
    <a class="rl-step" href="https://ltpbrief.mfgpilots.com/" target="_blank" rel="noopener">
      <span class="rl-step-lg"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#ic-brief"/></svg></span>
      <span class="rl-step-nm">Brief Intake</span>
      <span class="rl-step-n">01</span>
    </a>

    <div class="rl-foot" id="railFoot"></div>
  </aside>

  <main class="main">
    <header class="hd">
      <!-- Categories sit above the board rather than in the rail: they filter
           what is drawn to the right of them, and a filter reads better beside
           the thing it filters. One row, scrolled rather than wrapped, so the
           board never moves down as chips are toggled. -->
      <div class="cats" id="catStrip"></div>
      <div class="hd-right" id="hdRight"></div>
      <div class="hd-tools">
        <!-- Zoom is a property of the calendar, not of the page, so it is a
             control here rather than the browser's own zoom: it stretches the
             months and leaves the rail, the type and the labels alone. -->
        <div class="zoom" role="group" aria-label="Calendar zoom">
          <button class="tool zb" id="zoomOut" type="button" aria-label="Zoom out">&minus;</button>
          <button class="tool zrd" id="zoomRd" type="button"
            title="Back to the default width">100%</button>
          <button class="tool zb" id="zoomIn" type="button" aria-label="Zoom in">+</button>
        </div>
        <button class="tool" id="watchTog" type="button"
          title="Also draw the Watch band, not just Anchor and Play">Watch</button>
        <button class="tool" id="themeTog" type="button" aria-label="Switch theme">&#9790;</button>
      </div>
    </header>
    <div class="body" id="body"></div>
  </main>

  <!-- The reader, beside the board. Its own prefix throughout: `panel` and
       `pn-` already belong to the add-an-audience dialog, and two components
       sharing a class name is a cascade collision waiting to happen. -->
  <aside class="chat" id="chat">
    <div class="ck-hd">
      <span class="ck-mark" aria-hidden="true">&#10022;</span>
      <span class="ck-n">Gemini</span>
      <button class="ck-clear" id="chatClear" type="button">Clear</button>
      <button class="ck-fold" id="chatFold" type="button"
        aria-controls="chat" aria-expanded="true"
        aria-label="Collapse the Gemini panel">&rsaquo;</button>
    </div>
    <div class="ck-body" id="chatBody"></div>
    <div class="ck-ask">
      <textarea id="chatIn" rows="1" placeholder="Ask about the board…"></textarea>
      <button id="chatGo" type="button" aria-label="Send">&#9654;</button>
    </div>
  </aside>
</div>

<!-- The add-an-audience panel. Empty until it is opened, so nothing in it can
     be tabbed into or read out while it is closed. -->
<div class="panel-host" id="panel" hidden></div>

<!-- The methodology overlay. Its own `meth-` prefix: `pn-` belongs to the
     add-an-audience dialog, and two dialogs sharing a class name is a cascade
     collision waiting to happen. Empty until opened. -->
<div class="meth-host" id="meth" hidden></div>

<script type="module" src="/app.js"></script>
</body>
</html>
