/* ── data/relevance.js ── */
/* WHAT 'HIGH RELEVANCE' MEANS — a proposed methodology.

   The logic here is real and is what I would ship. The INPUTS it reads are
   placeholders (see audiences.js, and `scaleOf` below), so treat the numbers
   as illustrative and the model as the actual proposal.

   The rule the model is built around: a planner has to be able to argue with
   a score. So relevance is never a bare number — it is five named components
   that each answer a question a planner would otherwise ask out loud, and the
   UI always opens them up.

     AFFINITY      Does this audience care?          weight .50
     SCALE         How many of them show up?          weight .20
     ACTIONABILITY Can we actually buy into it?       weight .15
     TIMING        Is the date firm enough to plan?   weight .15
     CONGESTION    How loud is everything else?       multiplier, up to -25%

   Affinity is the driver and the thing that changes per audience — the other
   four are properties of the moment and are the same for everyone. That is
   deliberate: it keeps the audience switch honest. Flipping the rail should
   reorder the year because the audience cares about different things, not
   because the model quietly re-weighted itself.

   WHY .50 AND NOT .40. The first cut of this weighted affinity at .40, which
   left 60% of every score identical for all six audiences — so the Oscars came
   out top for Gen Z, for families AND for tech buyers, because a big, firmly
   dated, buyable moment wins on three terms out of four no matter who is
   watching. An audience switch that returns the same answer is not an audience
   switch. Affinity carries the majority now, and it is run through a curve
   (see `affinityOf`) rather than a straight rescale, because a flat map put
   every real-world index between 70 and 160 into a 35–80 band and flattened
   the only term that was supposed to vary.

   Congestion is a MULTIPLIER rather than a sixth weighted term because it is
   not a virtue of the moment, it is a tax on it. A moment that is perfect on
   the other four and lands in the loudest week of the year is still worth
   less than the same moment in a quiet one — but it never drops out of the
   running, which a subtractive term would let it do.

   Congestion is also the term that answers the Cultural Playground question
   the LTP process actually asks — "what is the moment nobody in the category
   has claimed?" — so it is surfaced in the UI on its own, not just folded
   into the total.                                                            */

/* ---------- the four moment-side components ---------- */

/* SCALE. Placeholder: a keyword ladder over the moment name, floored by
   category and nudged by whether the distributor is a major. In production
   this is one number per moment from the reach model — expected 18+ reach, or
   the buy's own delivery estimate — and this whole function disappears. */
const TENTPOLE = [
  [/super bowl|world cup|olympic/i, 100],
  [/world series|nba finals|stanley cup|playoffs|wimbledon|masters|kentucky derby|indy 500|daytona/i, 86],
  [/oscar|academy award|grammy|emmy|vma|video music award|game awards|met gala/i, 84],
  [/all-star|comic-con|coachella|unpacked|wwdc|ces\b/i, 78],
  [/thanksgiving|christmas|halloween|new year|black friday|prime day|mother's day|father's day/i, 82],
  [/final season|series finale|s\d+ finale/i, 66],
  [/world tour|tour\b/i, 60],
  [/album release/i, 54]
];
const CAT_SCALE = {
  'Sports': 62, 'Holidays': 74, 'Movies': 58, 'TV & Streaming': 52,
  'Music': 48, 'Tours & Concerts': 50, 'Gaming': 52,
  'Fashion & Awards': 60, 'Tech': 54, 'Culture': 56
};
const MAJORS = /disney|netflix|warner|nbcu|amazon|paramount|sony|fox|apple|umg|google|samsung|nintendo/i;

/* SPORTS SCALE COMES FROM MEASUREMENT, NOT FROM THE NAME.

   Everywhere else this term is a keyword ladder over the moment's title, which
   is a guess dressed as a number. For sport it does not have to be: WPP Media's
   Sports Reach analysis gives average 1-month P18-49 reach per league per
   month, off Nielsen's Big Data+Panel, and that is the actual answer to "how
   many of them show up".

   Two things it gets right that the ladder never could. It is SEASONAL — the
   NBA reaches 13.7% of P18-49 in October and 35.4% in May, and the ladder gave
   both the same 62. And it is ORDERED across leagues by measurement rather
   than by how famous the name sounds: the NFL in November (54.6%) really is
   four times the reach of the Premier League in November (4.8%).

   The curve. Reach runs from 0.2% to 54.6%, and mapping that straight onto
   0-100 would put every sport except the NFL in the bottom third — reach is
   distributed with a long thin tail and a score is not. The 0.6 exponent
   lifts the middle without reordering anything, so a 33% October MLB lands at
   74 and a 5% Premier League Saturday at 23.

   A moment whose league is not in the deck, or whose month is out of that
   league's season, falls through to the ladder below rather than to zero: an
   absent month means the deck did not measure it, not that nobody watched. */
const REACH = SPORTS_REACH;
const REACH_MAX = 55;          // the NFL in November, rounded up

/* Whole-word matching, always. The first cut of the entity keys in this file
   matched "CES" inside "Sciences"; three-letter league codes are exactly that
   trap again, so every acronym here is anchored. */
const LEAGUE = [
  ['NFL',                         /\bNFL\b|\bsuper bowl\b|\bpro bowl\b/i],
  ['College Football',            /\bCFB\b|college football|rose bowl|orange bowl|sugar bowl|fiesta bowl|peach bowl|cotton bowl|heisman|army.?navy/i],
  ['NBA',                         /\bNBA\b/i],
  ["Men's College Basketball",    /march madness men|men'?s college basketball|final four men|selection sunday/i],
  ["Women's College Basketball",  /march madness women|women'?s college basketball|final four women|ncaa women'?s final four/i],
  ['WNBA',                        /\bWNBA\b/i],
  ['MLB',                         /\bMLB\b|world series(?! of poker)|home run derby/i],
  ['NHL',                         /\bNHL\b|stanley cup|winter classic/i],
  ['MLS',                         /\bMLS\b/i],
  ['NWSL',                        /\bNWSL\b/i],
  ['Premier League',              /premier league/i],
  ['Liga MX',                     /liga mx/i],
  ['NASCAR Xfinity Series',       /xfinity series/i],
  ['NASCAR Cup Series',           /\bNASCAR\b|daytona 500|coke zero|brickyard/i],
  ['IndyCar',                     /\bindycar\b|indy 500/i],
  ['LPGA Golf',                   /\bLPGA\b/i],
  ['PGA Golf',                    /\bPGA\b|the masters|masters golf|open championship|ryder cup/i],
  ['Tennis',                      /wimbledon|\btennis\b|australian open|french open|roland garros/i],
  ['Horse Racing',                /kentucky derby|preakness|belmont stakes|breeders'? cup|horse racing/i],
  ['UFL',                         /\bUFL\b/i],
  ['College Softball',            /college softball|women'?s college world series/i],
  ["Women's College Volleyball",  /college volleyball|women'?s volleyball/i],
  ['WWE',                         /\bWWE\b|wrestlemania|royal rumble|summerslam/i],
  ['Unrivaled',                   /\bunrivaled\b/i]
];

const MON3 = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

/** The measured reach for a moment, or null when the deck cannot speak to it. */
function reachOf(m) {
  if (m.cat !== 'Sports') return null;
  for (const [league, re] of LEAGUE) {
    if (!re.test(m.name)) continue;
    const months = REACH[league];
    if (!months) return null;
    const mon = MON3[Number(String(m.start).slice(5, 7)) - 1];
    const pct = months[mon];
    return Number.isFinite(pct) ? { league, month: mon, pct } : null;
  }
  return null;
}

function scaleOf(m) {
  const r = reachOf(m);
  if (r) return Math.max(0, Math.min(100, Math.round(100 * Math.pow(r.pct / REACH_MAX, 0.6))));

  let s = CAT_SCALE[m.cat] ?? 50;
  for (const [re, v] of TENTPOLE) if (re.test(m.name)) { s = Math.max(s, v); break; }
  if (MAJORS.test(m.plat || '') || MAJORS.test(m.src || '')) s += 6;
  if (m.type === 'Evergreen') s += 4;               // returns every year, so it is known
  return Math.max(0, Math.min(100, s));
}

/* ACTIONABILITY. Can a plan actually enter this moment? A named distributor is
   a door; a declared sponsorship is an open one. A moment with neither is
   something you talk around, not something you buy. */
function actionabilityOf(m) {
  let a = 30;
  if (m.plat) a += 28;
  if (m.spons) a += 26;
  if (m.pas && m.pas.length) a += 10;
  if (m.type === 'Evergreen') a += 12;              // a repeating moment can be planned a year out
  return Math.max(0, Math.min(100, a));
}

/* TIMING. Straight off the sheet's own Date Confirmation column, which is the
   most honest field in the file. A window is plannable; a year is a placeholder
   that means December 31st; TBD cannot be flighted against at all. */
const TIMING = { 'Confirmed Date': 100, 'Confirmed Window': 80, 'Confirmed Year': 45, 'TBD': 15 };
function timingOf(m) { return TIMING[m.conf] ?? 40; }

/* An entity override has to match a WHOLE WORD, not a substring. The first cut
   tested `new RegExp(key, 'i')`, and "CES" duly matched the "ces" inside
   "Academy of Motion Picture Arts and Sciences" — which handed the Oscars a
   190 tech index and made them the single most relevant moment of the year for
   an audience that does not watch them. A three-letter key against 491 free-
   text names will always find something; the boundaries are not optional.

   Left as a named function rather than inlined because it is the piece most
   likely to need a test the day a real entity list arrives. */
function entityHits(key, m) {
  const re = new RegExp('(^|[^A-Za-z0-9])' + key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^A-Za-z0-9]|$)', 'i');
  return re.test(m.name) || re.test(m.src || '') || re.test(m.plat || '');
}

/* AFFINITY. Category index first, then any entity override that matches the
   moment's name or its source — an override is a sharper read, so it wins.

   The index is on a 100 base, and real cuts cluster hard: almost everything
   lands between 70 and 160, with only a handful of true passions above that.
   A straight rescale (index/200) maps that cluster into 35–80 and throws away
   most of the separation, so the curve below stretches the middle instead —
   100 sits at 50, and each 50 points of index is worth roughly 22 points of
   score until it saturates. An index of 100 means "no different from the
   population", and the model should treat it as exactly the midpoint. */
function affinityOf(m, aud) {
  let idx = aud.aff[m.cat] ?? 100;
  for (const [key, v] of Object.entries(aud.ent || {})) {
    if (entityHits(key, m)) idx = Math.max(idx, v);
  }
  /* Logistic on log-index, centred on 100. Monotonic, saturating at both ends,
     and steepest exactly where the data actually sits. */
  const t = Math.log(Math.max(20, idx) / 100) / Math.log(2);   // octaves above/below par
  return Math.max(0, Math.min(100, 100 / (1 + Math.exp(-2.1 * t))));
}

/* CONGESTION. How much else is fighting for the same week — everything, at
   quarter weight, plus same-category moments at full weight, because a
   category rival costs you more than a moment in a different world. Scaled so
   a typical week sits low and the Christmas fortnight sits high. */
function congestionIndex(moments) {
  const byWeek = new Map();
  for (const m of moments) {
    const k = weekKey(m.start);
    if (!byWeek.has(k)) byWeek.set(k, []);
    byWeek.get(k).push(m);
  }
  const idx = new Map();
  for (const m of moments) {
    const peers = byWeek.get(weekKey(m.start)) || [];
    const same = peers.filter(p => p.cat === m.cat).length - 1;
    const other = peers.length - 1 - same;
    idx.set(m.id, Math.max(0, Math.min(100, (same * 9 + other * 2.2))));
  }
  return idx;
}

function weekKey(iso) {
  const d = new Date(iso + 'T00:00:00Z');
  const day = (d.getUTCDay() + 6) % 7;                 // Monday = 0
  d.setUTCDate(d.getUTCDate() - day);
  return d.toISOString().slice(0, 10);
}

/* ---------- the score ---------- */


const WEIGHTS = { aff: 0.50, scale: 0.20, act: 0.15, tim: 0.15 };
const CONGESTION_MAX = 0.25;

/* Four bands, not a number. A planner does not act on 71 versus 68 — they act
   on "this is an anchor" versus "this is a thing we watch". The names are the
   decision the band asks for.

     ANCHOR  build a campaign beat on it
     PLAY    buy into it with what already exists
     WATCH   worth knowing, not worth a line item
     SKIP    say out loud that we are not doing it                            */
const BANDS = [
  { id: 'anchor', label: 'Anchor', min: 72, color: '#0B7A67', note: 'Build a beat on it.' },
  { id: 'play',   label: 'Play',   min: 56, color: '#1A67D2', note: 'Buy in with what exists.' },
  { id: 'watch',  label: 'Watch',  min: 40, color: '#946200', note: 'Know about it. No line item.' },
  { id: 'skip',   label: 'Skip',   min: 0,  color: '#5C6279', note: 'Say out loud we are not doing it.' }
];
const bandOf = s => BANDS.find(b => s >= b.min) || BANDS[BANDS.length - 1];

/* `aud` may be one audience or several. One is the ordinary case and behaves
   exactly as it always did; several combines their affinities by `mode` and
   keeps each one's own figure on the result, because a blended number nobody
   can take apart is precisely the kind of number this model refuses to
   produce. */
function scoreMoments(moments, aud, mode) {
  const auds = Array.isArray(aud) ? aud.filter(Boolean) : [aud];
  const weights = auds.map(sizeOf);
  const cong = congestionIndex(moments);
  return moments.map(m => {
    const each = auds.map(a => ({ id: a.id, name: a.name, value: affinityOf(m, a) }));
    const combined = combineAffinity(each.map(e => e.value), weights, mode || 'blend');
    const parts = {
      aff:   combined.value,
      scale: scaleOf(m),
      act:   actionabilityOf(m),
      tim:   timingOf(m),
      cong:  cong.get(m.id) ?? 0
    };
    const base = parts.aff * WEIGHTS.aff + parts.scale * WEIGHTS.scale
               + parts.act * WEIGHTS.act + parts.tim * WEIGHTS.tim;
    const score = Math.round(base * (1 - (parts.cong / 100) * CONGESTION_MAX));
    return {
      ...m, parts, score, band: bandOf(score),
      affBy: each.length > 1 ? each : null,
      affWeighted: combined.weighted
    };
  });
}

/* The unclaimed moment. Not the highest score — the highest affinity sitting in
   the quietest week, which is a different and more interesting question, and
   the one stage 6.2 actually asks. */
function unclaimed(scored) {
  return [...scored]
    .filter(m => m.parts.aff >= 55 && m.parts.tim >= 80)
    .sort((a, b) => (b.parts.aff - b.parts.cong * 1.4) - (a.parts.aff - a.parts.cong * 1.4))
    .slice(0, 6);
}

/* ============================================================
   MORE THAN ONE AUDIENCE
   ============================================================

   Only affinity combines. The other four components are facts about the
   moment — its scale, whether there is a way in, how firm the date is, how
   loud that week is — and they do not change because a second audience is
   selected. That falls straight out of the model's central rule and is what
   keeps a multi-audience score comparable with a single-audience one.

   Three ways to combine, because they answer three different briefs and a
   planner means a different thing each time:

     BLEND    the combined audience. A size-weighted mean, which is literally
              what a target audience made of two groups is. The default.
     OVERLAP  the lowest of them. "Where does ONE buy serve all of them?" —
              a moment only survives if every selected audience cares.
     ANY      the highest of them. "Where do we reach at least one of them
              well?" — the reach brief rather than the efficiency one.

   Blend needs sizes, and a user-defined audience may not have given one.
   Rather than invent a weight, an incomplete set falls back to an unweighted
   mean and says so — `weighted: false` travels with the result so the UI can
   report it instead of quietly implying a precision it does not have. */

const MODES = [
  { id: 'blend',   label: 'Blend',   note: 'The combined audience — size-weighted.' },
  { id: 'overlap', label: 'Overlap', note: 'Only what works for every one of them.' },
  { id: 'any',     label: 'Any',     note: 'What works for at least one of them.' }
];

/* "31.4M" -> 31400000. Returns null for anything it cannot read, which is the
   signal to stop weighting rather than to guess a number. */
function sizeOf(a) {
  const m = /^\s*([\d.,]+)\s*([kmb])?/i.exec(String((a && a.size) || ''));
  if (!m) return null;
  const n = Number(m[1].replace(/,/g, ''));
  if (!Number.isFinite(n) || n <= 0) return null;
  const mult = { k: 1e3, m: 1e6, b: 1e9 }[(m[2] || '').toLowerCase()] || 1;
  return n * mult;
}

function combineAffinity(values, weights, mode) {
  if (!values.length) return { value: 0, weighted: false };
  if (values.length === 1) return { value: values[0], weighted: false };
  if (mode === 'overlap') return { value: Math.min(...values), weighted: false };
  if (mode === 'any') return { value: Math.max(...values), weighted: false };

  const usable = weights && weights.length === values.length && weights.every(w => w > 0);
  if (!usable) {
    return { value: values.reduce((s, v) => s + v, 0) / values.length, weighted: false };
  }
  const total = weights.reduce((s, w) => s + w, 0);
  return {
    value: values.reduce((s, v, i) => s + v * weights[i], 0) / total,
    weighted: true
  };
}

/* ── data/parse.js ── */
/* Turning whatever the user drops in into an audience.

   The data that defines an audience arrives as a two-column thing — a label and
   a number — and it arrives from a dozen places: a CSV export, a cell range
   copied out of Sheets, a block of text typed by hand. So the parser is
   deliberately loose about SHAPE and strict about MEANING: it will take commas,
   tabs, colons, pipes, em-dashes or runs of spaces as a separator, but a line
   only counts once its label has been matched to a real category or kept
   explicitly as an entity.

   What it never does is guess a number. A category the input does not mention
   comes back unmatched and stays at par in the UI, where the user can see the
   gap and fill it. Silently defaulting a missing category to 100 would be the
   same class of mistake as a hallucinated affinity — an invented input that
   drives the whole tool and leaves no trace.                                  */

const CATEGORIES = [
  'Sports', 'Music', 'Tours & Concerts', 'TV & Streaming', 'Movies',
  'Gaming', 'Holidays', 'Fashion & Awards', 'Tech', 'Culture',
  'Heritage & Identity', 'National Days'
];

/* The names people actually type. Matched on normalised tokens, longest first,
   so "live music" reaches Tours & Concerts rather than Music. */
const ALIASES = {
  'Sports':           ['sports', 'sport', 'live sports', 'athletics'],
  'Music':            ['music', 'album', 'albums', 'album releases', 'music releases', 'recorded music'],
  'Tours & Concerts': ['tours concerts', 'tours', 'concerts', 'touring', 'live music', 'gigs', 'festivals', 'concert'],
  'TV & Streaming':   ['tv streaming', 'tv', 'television', 'streaming', 'svod', 'series', 'shows'],
  'Movies':           ['movies', 'movie', 'film', 'films', 'cinema', 'theatrical', 'box office'],
  'Gaming':           ['gaming', 'games', 'video games', 'game', 'esports', 'egaming'],
  'Holidays':         ['holidays', 'holiday', 'seasonal', 'seasonality'],
  'Fashion & Awards': ['fashion awards', 'fashion', 'awards', 'award shows', 'red carpet', 'awards shows'],
  'Tech':             ['tech', 'technology', 'consumer tech', 'devices', 'gadgets'],
  'Culture':          ['culture', 'cultural', 'events', 'conventions', 'events conventions', 'news'],
  /* A cut names these a dozen ways. "Multicultural" and "LGBTQ" arrive as
     separate lines in most panels and both belong here; the aliases are listed
     rather than pattern-matched so a new one is a visible edit. */
  'Heritage & Identity': ['heritage identity', 'heritage', 'identity', 'multicultural',
                          'diversity', 'lgbtq', 'lgbtqia', 'lgbt', 'pride',
                          'heritage months', 'awareness', 'awareness months'],
  'National Days':    ['national days', 'national day', 'observances', 'awareness days',
                       'commemorative days', 'civic days']
};

const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

/* Longest alias first so "live music" is tested before "music". */
const LOOKUP = Object.entries(ALIASES)
  .flatMap(([cat, list]) => list.map(a => [norm(a), cat]))
  .sort((a, b) => b[0].length - a[0].length);

function matchCategory(label) {
  const n = norm(label);
  if (!n) return null;
  for (const [alias, cat] of LOOKUP) if (n === alias) return cat;
  for (const [alias, cat] of LOOKUP) {
    /* Whole-word containment, never a bare substring — the same rule the
       relevance model's entity keys are held to, and for the same reason. */
    if (new RegExp(`(^| )${alias}( |$)`).test(n)) return cat;
  }
  return null;
}

/* A line is split on the run of separator characters that still leaves a whole
   number on the right, so "Tours / Concerts, 150" keeps its slash and
   "TV & Streaming: 110" keeps its ampersand.

   A bare hyphen is NOT a separator. It was, and "Sports,-12" came back as
   positive 12 — the hyphen was consumed as punctuation and the minus sign
   vanished, which silently turns an audience that avoids a category into one
   that is merely par on it. Dashes people actually use as separators are the
   em and en dash, and a hyphen with spaces around it; both are normalised to a
   tab first, so the character class never has to contain one. */
const LINE = /^(.*?)[\s,;:|]+(-?\d[\d,]*(?:\.\d+)?)\s*%?$/;
const splitLine = t => LINE.exec(t.replace(/[—–]/g, '\t').replace(/ - /g, '\t'));

/* Prose that happens to end in a number is not a data row. "Audience: women
   18-34" used to arrive as an entity override called "Audience: women 18-" —
   an invented input, which is the same failure as a hallucinated one. An
   entity is a name: a few words, and at least one letter. */
const looksLikeAName = s => /[A-Za-z]/.test(s) && s.trim().split(/\s+/).length <= 5;

function parseAudienceData(text) {
  const aff = {};
  const entities = {};
  const unmatched = [];
  const ignored = [];
  const seen = new Set();

  const raw = String(text || '').split(/\r?\n/);
  const values = [];

  const rows = [];
  for (const line of raw) {
    const t = line.trim();
    if (!t) continue;
    const m = splitLine(t);
    if (!m) { if (t.length < 120) ignored.push(t); continue; }
    const label = m[1].replace(/^["']|["']$/g, '').trim();
    const value = Number(m[2].replace(/,/g, ''));
    if (!label || !Number.isFinite(value)) { ignored.push(t); continue; }
    rows.push({ label, value });
    values.push(value);
  }

  /* SCALE. An index is on a 100 base, but people paste multipliers (1.45) and
     they paste percentages (14.5%). If nothing in the column exceeds 5 the
     column cannot be an index — an audience that under-indexes at 5 does not
     exist — so it is read as a multiplier of par. Anything else is taken at
     face value. Reported back, so the guess is visible rather than silent. */
  const max = values.length ? Math.max(...values.map(Math.abs)) : 0;
  const asMultiplier = values.length > 0 && max <= 5;
  const scale = v => asMultiplier ? Math.round(v * 100) : Math.round(v);

  for (const { label, value } of rows) {
    const cat = matchCategory(label);
    const v = scale(value);
    if (cat) {
      if (seen.has(cat)) continue;      // first mention wins
      seen.add(cat);
      aff[cat] = v;
    } else if (looksLikeAName(label)) {
      /* Not a category, but a label with a number beside it — a franchise, an
         artist, a league. That is exactly the shape of an entity override, so
         it is offered as one rather than thrown away. */
      entities[label] = v;
      unmatched.push({ label, value: v });
    } else {
      ignored.push(label);
    }
  }

  return {
    aff,
    entities,
    unmatched,
    ignored,
    asMultiplier,
    matched: [...seen],
    missing: CATEGORIES.filter(c => !seen.has(c))
  };
}

/* Turning a filled-in panel into an audience record.

   Pure, and separate from the panel, because this is where the rules live:
   which numbers are real, what fills the gaps, and what the record says about
   its own provenance. A rule that only exists inside a click handler is a rule
   that never gets tested. */
function buildAudience(draft, categories, takenIds) {
  const name = String(draft.name || '').trim();
  if (!name) throw new Error('an audience needs a name');

  /* Par fills the gaps HERE, at the last moment, rather than at parse time —
     so the panel can go on showing which numbers were read and which were
     never mentioned right up until the audience is saved. */
  const aff = {};
  const atPar = [];
  for (const c of categories) {
    const v = draft.aff ? draft.aff[c] : undefined;
    if (Number.isFinite(v)) aff[c] = v;
    else { aff[c] = 100; atPar.push(c); }
  }

  const base = name.toLowerCase().replace(/[^a-z0-9]+/g, '').slice(0, 12) || 'audience';
  let id = base, n = 2;
  const taken = new Set(takenIds || []);
  while (taken.has(id)) id = base + (n++);

  const read = categories.length - atPar.length;

  /* ESTIMATED. Set when the indices were reasoned from a description rather
     than read off a cut. It rides on the record itself rather than being
     inferred later from how the panel happened to be used, because every
     surface that draws this audience has to be able to say so — and an
     estimate that loses its label on the way into storage is worse than no
     label at all: it becomes indistinguishable from a real cut. */
  const est = !!draft.est;

  const provenance = read === 0
    ? 'no categories set — every one at par'
    : `${read} of ${categories.length} categories set, ${atPar.length} left at par`;

  return {
    id,
    name,
    def: String(draft.def || '').trim() || 'Added in this browser. No definition given.',
    size: String(draft.size || '').trim(),
    aff,
    ent: { ...(draft.ent || {}) },
    custom: true,
    est,
    /* Why each index is what it is, where anything said so. Kept per category
       so the panel can put a reason under the number it explains. */
    why: { ...(draft.why || {}) },
    /* What the numbers rest on, kept with them. A cut with no provenance is
       exactly what this tool exists to make impossible. */
    read: est ? `estimated from a description — ${provenance}` : provenance,
    atPar
  };
}

/* ── strip.js ── */
/* A sliding strip of chrome, and the fold that puts it away.
   Shared across the planning modules — this file is copied between them the
   way `_gate.js` is, so it knows nothing about what is inside the strip. It is
   handed a box, a button and a key prefix, and it owns the fold: the measured
   width, `inert` when shut, the remembered state, and the demonstration that
   is the only thing telling anybody the fold exists.

   What travels in the strip is each module's business. What the strip DOES is
   the same everywhere, and this is the part that has been wrong twice.

   OPEN UNTIL SOMEBODY SHUTS IT. Hiding the contents by default was tried and
   taken back: the reason they are in the chrome rather than a menu is that
   they can be seen, and a strip that starts closed gives that away to save a
   few pixels nobody asked for.

   A working preference, not content. It belongs to this browser and stays out
   of anything that syncs, so a plan opened on somebody else's machine does not
   arrive with their strip shut. */

const Strip = (() => {
  /* How long the demonstration stands open before it folds. Long enough to be
     looked at, short enough not to read as the page still loading. */
  const TEACH_AFTER = 2000;
  /* Visits between reminders, once it has been shown and folded. */
  const REMIND_EVERY = 5;
  /* Waiting on whatever `hold` is guarding. Retried rather than abandoned. */
  const HOLD_RETRY = 1400;

  let box = null;
  let tog = null;
  let labels = { hide: 'Hide these controls', show: 'Show these controls' };
  let hold = null;
  /* Three keys, namespaced per module. The fold and the demonstration are
     genuinely different facts and each needs its own. */
  let KEY = '', SEEN_KEY = '', SEEN_N = '';

  function read(k) {
    try { return localStorage.getItem(k) || ''; } catch (e) { void e; return ''; }
  }
  function write(k, v) {
    try { localStorage.setItem(k, v); } catch (e) { void e; }
  }

  /* WIDTH IS MEASURED, NOT GUESSED, AND THAT IS THE WHOLE OF THE SMOOTHNESS.
   *
   * This animated `max-width` from a fixed ceiling — a number chosen to be
   * comfortably larger than the strip ever gets. The strip is nearer 200px, so
   * the first stretch of every collapse clipped nothing at all and the whole
   * thing then happened in what was left. It dropped no frames; the motion was
   * simply not linear in the property being watched, which is what "not
   * smooth" actually looks like.
   *
   * So the real width is read off the element and the animation runs between
   * that and zero. Driven inline rather than from the stylesheet, because only
   * script knows how wide the strip is on this screen at this moment.
   *
   * `quiet` restores a remembered fold without performing it. Somebody who
   * folded this yesterday should find it folded, not watch it fold again on
   * every load.
   */
  let full = 0;

  function fold(shut, keep, quiet) {
    if (!box) return;

    /* Measured while it is open, which is the only time the answer is true. */
    if (!box.classList.contains('shut')) {
      const seen = box.scrollWidth;
      if (seen) full = seen;
    }

    if (quiet) {
      box.classList.add('nofx');
      box.style.maxWidth = shut ? '0px' : '';
      /* Two frames, because one is not enough to guarantee the class landed
         before the transition is allowed back. */
      requestAnimationFrame(() => requestAnimationFrame(() => box.classList.remove('nofx')));
    } else if (shut) {
      /* Start from the true width, commit it, then run to nothing. Without the
         forced reflow the browser coalesces both writes and there is no
         animation at all — just a disappearance. */
      box.style.maxWidth = (full || box.scrollWidth) + 'px';
      void box.offsetWidth;
      box.style.maxWidth = '0px';
    } else {
      box.style.maxWidth = (full || box.scrollWidth) + 'px';
      /* Released afterwards so the strip can size itself again — a pinned
         width would clip anything added to it later. */
      const done = e => {
        if (e.propertyName !== 'max-width') return;
        box.style.maxWidth = '';
        box.removeEventListener('transitionend', done);
      };
      box.addEventListener('transitionend', done);
    }

    box.classList.toggle('shut', shut);
    if (tog) {
      tog.setAttribute('aria-expanded', shut ? 'false' : 'true');
      tog.textContent = shut ? '‹' : '›';
      tog.title = shut ? labels.show : labels.hide;
    }
    /* `inert` rather than only width, because a strip folded to nothing is
       still in the tab order otherwise — and tabbing into a control you cannot
       see is worse than the crowding this removes. */
    box.inert = shut;
    if (keep) write(KEY, shut ? 'shut' : 'open');
  }

  /* ---- and it shows itself, once ------------------------------------------
   *
   * A control that starts folded is a control nobody finds: there is nothing
   * on screen to say the icons exist or that the arrow brings them back.
   * A control that starts open forever is the crowding it was there to fix.
   *
   * So on the first visit it opens, waits long enough to be looked at, and
   * closes itself. The movement is the only thing that teaches it, and it is
   * spent once — the fold is recorded on the way out, so every visit after
   * this one simply starts folded.
   *
   * ⚠️ KEYED ON HAVING NO ANSWER, NOT ON THE ANSWER BEING OPEN. Somebody who
   * has folded it has been taught, and re-teaching them would be the tool
   * re-opening a thing they deliberately shut.
   */

  /* ⚠️ WHEN THE STRIP SHOWS ITSELF. Pure, and separated from everything that
     touches the DOM, because this is the part that has been wrong twice.

     Three cases and they are genuinely different:

       never shown — show it. This is the only thing that says the icons exist
         and that the arrow brings them back.

       shown, and open — show nothing. The reminder exists for a control that
         cannot be seen; folding an open strip every fifth visit would be the
         tool overriding a preference in order to advertise itself.

       shown, and folded — remind, every fifth visit. Folded is the steady
         state, and a folded control is one people forget. `>=` rather than a
         modulo, so a count that overshot — a tab restored, a reload storm —
         still comes due rather than waiting for the number to line up again. */
  function due(seen, kept, n) {
    if (!seen) return true;
    if (kept !== 'shut') return false;
    const visits = Number(n);
    if (!isFinite(visits)) return false;
    return visits >= REMIND_EVERY;
  }

  /* Shown, and the count starts again from here. */
  function markTaught() {
    write(SEEN_KEY, '1');
    write(SEEN_N, '0');
  }

  function teach(kept) {
    if (!box) return;

    /* ⚠️ TWO FACTS, NOT ONE. This used to bail on `kept` — on this browser
       having any opinion about the fold at all. But the fold key is written
       the instant somebody presses the toggle, so anybody who had ever touched
       the strip was permanently excluded from the one thing that teaches it
       exists. Which is everybody already using the tool.

       Folded-or-open is a preference. Shown-or-not is a fact about this
       browser's history, and it needs a key of its own. */
    const seen = read(SEEN_KEY);
    /* Counted on the way in, whether or not it is due — otherwise a visit
       that was not due would not count towards the next one. */
    const n = Number(read(SEEN_N) || 0) + 1;
    write(SEEN_N, String(n));

    if (!due(seen, kept, n)) return;

    /* A REMINDER OPENS BEFORE IT CLOSES. On the first visit it is already
       open; on a fifth it is folded, and there is nothing to watch collapse
       unless it comes back first. Unfolded quietly so the reminder reads as
       one movement — out, pause, away — rather than two. */
    if (kept === 'shut') fold(false, false, true);

    /* THE DEMONSTRATION IS THE MOVEMENT. Without motion it is a snap that
       reads as a glitch and teaches nothing, so that browser is given the
       folded state it would have ended at and nothing is performed at it. */
    let still = false;
    try {
      still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (e) { void e; }
    if (still) { fold(true, true, true); markTaught(); return; }

    const shut = () => {
      /* Something else may be measuring this chrome — a tour that has drawn a
         ring against a rect it already took. Chrome that reflows underneath
         leaves the ring around nothing, so this waits rather than competing
         with it. */
      if (hold && hold()) { setTimeout(shut, HOLD_RETRY); return; }
      /* And if they folded it themselves while this was waiting, there is
         nothing left to demonstrate. */
      fold(true, true);
      markTaught();
    };
    setTimeout(shut, TEACH_AFTER);
  }

  /* Wired, and the remembered fold restored without performing it. Returns
     what this browser already knew, because the demonstration is deliberately
     NOT run from here: a first visit may meet a start screen or an overlay
     first, and a demonstration performed behind one is a demonstration nobody
     sees — which is the entire point of it. The module calls `teach` when
     there is something to see it happen on. */
  function init(o) {
    box = o.box || null;
    tog = o.tog || null;
    hold = o.hold || null;
    if (o.labels) labels = o.labels;
    const p = o.prefix || 'ltp';
    KEY = p + '.strip';
    SEEN_KEY = p + '.strip.seen';
    SEEN_N = p + '.strip.n';
    if (!box || !tog) return '';

    tog.addEventListener('click', () => fold(!box.classList.contains('shut'), true));
    const kept = read(KEY);
    fold(kept === 'shut', false, true);
    return kept;
  }

  return { init, fold, teach, due };
})();

/* Copied between modules, so it has to survive being read by a test runner
   that has no DOM. */
if (typeof module !== 'undefined' && module.exports) module.exports = Strip;

/* ── app.js ── */
/* LTP Moments — five directions over one state.

   Every direction reads the same three things: the audience selected in the
   rail, the categories left switched on, and the twelve-month window. Nothing
   is per-direction except how it draws — so switching directions never changes
   what is being argued, only how it is shown, which is the only way five
   mockups can be compared honestly. */




/* ---------- audiences the user has added ---------- */
/* The six that ship are placeholders and are marked as such. An audience the
   user defines is theirs, lives in their browser, and is never mixed in with
   the built-ins — it carries `custom` so the rail can say which is which and
   only offer to delete the ones it is safe to delete. */

function loadCustom() {
  try {
    const raw = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
    return Array.isArray(raw) ? raw.filter(a => a && a.id && a.name && a.aff) : [];
  } catch (e) { void e; return []; }
}
