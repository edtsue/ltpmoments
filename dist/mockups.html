<title>LTP Moments</title>
<style>
/* LTP Moments — mockups, in the Atlas light family the rest of the LTP tools
   use. Tokens are lifted from ltpstrategy/css/atlas.css unchanged, so a
   component moved between the two keeps its colour and its weight.

   Three theme states, not two: an explicit choice stamps data-theme, and the
   default system setting stamps nothing, so the dark palette is declared twice
   — once behind prefers-color-scheme guarded against an explicit light, and
   once behind the stamp. Nothing below the token blocks declares a colour. */

:root {
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --shell: #EEF0F5;
  --shell-2: #FFFFFF;
  --shell-ink: #14161F;
  --shell-ink2: #3D4256;
  --shell-ink3: #5C6279;
  --shell-line: rgba(20, 22, 31, .12);

  --card: #FFFFFF;
  --sunken: #F7F8FB;
  --well: #EAEEF6;
  --eg: #EAF1FE;
  --eg-line: rgba(66, 133, 244, .22);

  --a04: rgba(20, 22, 31, .04);
  --a06: rgba(20, 22, 31, .06);
  --a08: rgba(20, 22, 31, .08);
  --a12: rgba(20, 22, 31, .12);
  --a16: rgba(20, 22, 31, .16);
  --a22: rgba(20, 22, 31, .22);
  --shadow-a: rgba(20, 22, 31, .28);
  --scrim: rgba(20, 22, 31, .38);

  --g1: #4285F4; --g2: #9B72CB; --g3: #D96570;
  --cy: #0FA98F; --cy-ink: #0B7A68;
  --vi: #6D5DE0; --vi-ink: #4436B8;
  --fwd: #D93025;

  --pill-blue: #1A67D2;  --pill-blue-line: rgba(26, 103, 210, .38);
  --pill-amber: #946200; --pill-amber-line: rgba(148, 98, 0, .38);
  --pill-green: #0B7A67; --pill-green-line: rgba(11, 122, 103, .38);

  --on-fill: #FFFFFF;
  --lede-ink: #262A38;
  --rail-w: 248px;

  /* THE CATEGORY COLOURS DO NOT INVERT — a category's hue is how a reader maps
     one direction onto another, and a hue that moved between themes would break
     that. What moves is the depth they are drawn AT, and only where the colour
     is thin: an 8px swatch, a 3px rule, a hairline border. #0B7A67 is chosen to
     hold as a fill under white type, which it does in both themes; as a dot on
     near-black it disappears.

     So: solid fills keep the colour exactly. Thin uses take `--ci`, which is
     the same hue lifted toward white by an amount that is zero in light. */
  --lift: #FFFFFF;
  --lift-amt: 0%;
}

/* Anything carrying a category colour computes its thin variant once, here,
   rather than each rule mixing its own and drifting. */
.sw, .dot, .chip, .bar, .mcard, .pm-cell {
  --ci: color-mix(in srgb, var(--c, currentColor), var(--lift) var(--lift-amt));
}

:root[data-theme="dark"], html[data-theme="dark"] { color-scheme: dark; }
:root:not([data-theme="light"]) { color-scheme: light; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --shell: #0E1014;
    --shell-2: #171A21;
    --shell-ink: #E8EAF0;
    --shell-ink2: #AEB4C6;
    --shell-ink3: #8B92A6;
    --shell-line: rgba(232, 234, 240, .14);
    --card: #171A21;
    --sunken: #1E222B;
    --well: #222736;
    --eg: #17233A;
    --eg-line: rgba(138, 180, 248, .26);
    --a04: rgba(232, 234, 240, .05);
    --a06: rgba(232, 234, 240, .07);
    --a08: rgba(232, 234, 240, .09);
    --a12: rgba(232, 234, 240, .13);
    --a16: rgba(232, 234, 240, .17);
    --a22: rgba(232, 234, 240, .23);
    --shadow-a: rgba(0, 0, 0, .55);
    --scrim: rgba(0, 0, 0, .62);
    --cy: #4FD8C0; --cy-ink: #4FD8C0;
    --vi: #A99BFF; --vi-ink: #A99BFF;
    --pill-blue: #8AB4F8;  --pill-blue-line: rgba(138, 180, 248, .38);
    --pill-amber: #F7C56B; --pill-amber-line: rgba(247, 197, 107, .38);
    --pill-green: #5FD3B4; --pill-green-line: rgba(95, 211, 180, .38);
    --lede-ink: #C6CBDA;
    --lift-amt: 34%;
  }
}
:root[data-theme="dark"] {
  --shell: #0E1014;
  --shell-2: #171A21;
  --shell-ink: #E8EAF0;
  --shell-ink2: #AEB4C6;
  --shell-ink3: #8B92A6;
  --shell-line: rgba(232, 234, 240, .14);
  --card: #171A21;
  --sunken: #1E222B;
  --well: #222736;
  --eg: #17233A;
  --eg-line: rgba(138, 180, 248, .26);
  --a04: rgba(232, 234, 240, .05);
  --a06: rgba(232, 234, 240, .07);
  --a08: rgba(232, 234, 240, .09);
  --a12: rgba(232, 234, 240, .13);
  --a16: rgba(232, 234, 240, .17);
  --a22: rgba(232, 234, 240, .23);
  --shadow-a: rgba(0, 0, 0, .55);
  --scrim: rgba(0, 0, 0, .62);
  --cy: #4FD8C0; --cy-ink: #4FD8C0;
  --vi: #A99BFF; --vi-ink: #A99BFF;
  --pill-blue: #8AB4F8;  --pill-blue-line: rgba(138, 180, 248, .38);
  --pill-amber: #F7C56B; --pill-amber-line: rgba(247, 197, 107, .38);
  --pill-green: #5FD3B4; --pill-green-line: rgba(95, 211, 180, .38);
  --lede-ink: #C6CBDA;
  --lift-amt: 34%;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--shell);
  color: var(--shell-ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font-family: inherit; }

/* ============================================================
   MOCKUP CHROME
   Dark, and above everything, because it is not part of the product. A reader
   should never be a moment unsure whether the switcher is a feature.
   ============================================================ */
.mk {
  position: sticky;
  top: 0;
  z-index: 90;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  padding: 9px 18px;
  background: #14161F;
  color: #F2F3F7;
  border-bottom: 1px solid rgba(255, 255, 255, .14);
}
.mk-lb {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: rgba(242, 243, 247, .52);
}
.mk-tabs { display: flex; gap: 6px; flex-wrap: wrap; flex: 1 1 auto; }
.mk-tab {
  display: inline-flex;
  align-items: baseline;
  gap: 7px;
  height: 30px;
  padding: 0 12px;
  border: 1px solid rgba(255, 255, 255, .18);
  border-radius: 999px;
  background: transparent;
  color: rgba(242, 243, 247, .78);
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  transition: background .14s, color .14s, border-color .14s;
}
.mk-tab i {
  font-style: normal;
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .1em;
  opacity: .6;
}
.mk-tab:hover { background: rgba(255, 255, 255, .1); color: #fff; }
.mk-tab.on { background: #F2F3F7; border-color: #F2F3F7; color: #14161F; font-weight: 600; }
.mk-tab.on i { opacity: .55; }
.mk-note { font-size: 11.5px; color: rgba(242, 243, 247, .58); }
.mk-tog {
  height: 30px;
  padding: 0 11px;
  border: 1px solid rgba(255, 255, 255, .18);
  border-radius: 999px;
  background: transparent;
  color: rgba(242, 243, 247, .78);
  font-size: 12px;
  cursor: pointer;
}
.mk-tog:hover { background: rgba(255, 255, 255, .1); color: #fff; }

/* ============================================================
   SHELL
   ============================================================ */
.app {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  height: calc(100dvh - 49px);
  min-height: 620px;
}

/* ---------- rail ---------- */
.rail {
  background: var(--shell-2);
  border-right: 1px solid var(--shell-line);
  padding: 18px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow-y: auto;
}
.rl-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  font-size: 16.5px;
  letter-spacing: -.01em;
  line-height: 1.15;
  margin-bottom: 15px;
}
.rl-lg { width: 30px; height: 30px; flex: none; }
.rl-lg svg { width: 30px; height: 30px; border-radius: 9px; display: block; }
.rl-nm { flex: 1 1 auto; min-width: 0; }
.modpill {
  flex: none;
  padding: 2px 7px;
  border: 1px solid var(--shell-line);
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: .1em;
  color: var(--shell-ink3);
  text-decoration: none;
}

.rl-hd {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--shell-ink3);
  margin: 4px 3px 8px;
}
.rl-hd.gap { margin-top: 20px; }

/* The audience switch. One at a time, and the whole board answers to it — so
   it is a radio in behaviour and reads as one, with the selected row carrying
   the same blue fill the LTP rail uses for the stage you are standing on. */
.aud {
  position: relative;
  display: block;
  width: 100%;
  text-align: left;
  border: 1px solid transparent;
  background: none;
  border-radius: 11px;
  padding: 9px 11px;
  cursor: pointer;
  color: var(--shell-ink2);
  transition: background .16s, color .16s, border-color .16s;
}
.aud + .aud { margin-top: 2px; }
.aud:hover { background: var(--a04); }
.aud .an { font-size: 12.8px; font-weight: 600; line-height: 1.25; display: block; }
.aud .as {
  display: block;
  margin-top: 3px;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: .06em;
  color: var(--shell-ink3);
}
.aud.on {
  background: rgba(66, 133, 244, .14);
  border-color: rgba(66, 133, 244, .3);
  color: var(--pill-blue);
}
.aud.on .an { color: inherit; }
.aud.on .as { color: inherit; opacity: .8; }
.aud:focus-visible { outline: 2px solid var(--vi); outline-offset: -2px; }

.aud-def {
  margin: 8px 3px 0;
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--shell-ink3);
}

/* Category filter. Chips rather than checkboxes: ten of them fit in the rail
   only as chips, and the colour is doing the identifying anyway. */
.cats { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 2px; }
.cat {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  border: 1px solid var(--shell-line);
  border-radius: 999px;
  background: var(--card);
  font-size: 10.5px;
  color: var(--shell-ink3);
  cursor: pointer;
  transition: border-color .14s, color .14s, opacity .14s;
}
.cat .sw { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--ci); }
.cat.off { opacity: .4; }
.cat:hover { border-color: var(--shell-ink3); color: var(--shell-ink); }

.rl-foot {
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid var(--shell-line);
  font-family: var(--mono);
  font-size: 9.5px;
  line-height: 1.6;
  letter-spacing: .04em;
  color: var(--shell-ink3);
}

/* ---------- main ---------- */
.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}
.hd {
  flex: none;
  display: flex;
  align-items: flex-start;
  gap: 24px;
  padding: 20px 26px 16px;
  border-bottom: 1px solid var(--shell-line);
}
.hd-tx { min-width: 0; flex: 1 1 auto; }
.hd h1 {
  margin: 0;
  font-size: 23px;
  letter-spacing: -.025em;
  font-weight: 680;
}
.hd .kick {
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--shell-ink3);
  margin-bottom: 5px;
}
.hd p {
  margin: 7px 0 0;
  font-size: 13px;
  line-height: 1.55;
  color: var(--lede-ink);
  max-width: 78ch;
}
.hd-right { display: flex; gap: 8px; flex: none; flex-wrap: wrap; justify-content: flex-end; }
.hd-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 28px;
  padding: 0 12px;
  border: 1px solid var(--pill-line, var(--shell-line));
  border-radius: 999px;
  background: var(--shell-2);
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--pill-ink, var(--shell-ink3));
  white-space: nowrap;
}
.hd-pill b { font-weight: 700; color: var(--shell-ink); letter-spacing: 0; font-size: 11px; }

.body { flex: 1 1 auto; overflow: auto; padding: 20px 26px 60px; }

/* ---------- band vocabulary, shared by all five ---------- */
.bandpill {
  display: inline-flex;
  align-items: center;
  height: 19px;
  padding: 0 8px;
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  white-space: nowrap;
}
.bandpill.anchor { background: rgba(11, 122, 103, .14); color: var(--pill-green); }
.bandpill.play   { background: rgba(26, 103, 210, .14); color: var(--pill-blue); }
.bandpill.watch  { background: rgba(148, 98, 0, .14);   color: var(--pill-amber); }
.bandpill.skip   { background: var(--a08);              color: var(--shell-ink3); }

.legend {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  font-size: 11.5px;
  color: var(--shell-ink3);
}
.legend .li { display: inline-flex; align-items: center; gap: 6px; }
.legend .li b { font-weight: 600; color: var(--shell-ink2); }

/* ============================================================
   01 — THE YEAR WALL
   ============================================================ */
.wall { min-width: 1020px; }
.wall-row {
  display: grid;
  grid-template-columns: 128px repeat(var(--months, 12), minmax(0, 1fr));
  gap: 6px;
  align-items: stretch;
}
.wall-row + .wall-row { margin-top: 6px; }
.wall-hd { position: sticky; top: 0; z-index: 5; background: var(--shell); padding-bottom: 6px; }
.wall-mo {
  padding: 6px 8px 7px;
  border-radius: 9px;
  background: var(--card);
  border: 1px solid var(--shell-line);
}
.wall-mo .m {
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--shell-ink2);
}
.wall-mo .y { font-size: 8.5px; opacity: .55; margin-left: 4px; }
/* A weight bar under the month name — the month's total relevance for this
   audience, as a share of the loudest month. It is what turns twelve equal
   columns into a shape. */
.wall-mo .bar { height: 4px; border-radius: 3px; background: var(--a08); margin-top: 5px; overflow: hidden; }
.wall-mo .bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--g1), var(--g2)); }
.wall-cat {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 9px;
  border-radius: 9px;
  background: var(--card);
  border: 1px solid var(--shell-line);
  font-size: 11.5px;
  font-weight: 600;
  color: var(--shell-ink2);
  line-height: 1.2;
}
.wall-cat .sw { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--ci); }
.wall-cat .n {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  color: var(--shell-ink3);
}
.wall-cell {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 5px;
  border-radius: 9px;
  background: var(--sunken);
  border: 1px solid transparent;
  min-height: 44px;
}
.wall-cell.empty { background: transparent; border-style: dashed; border-color: var(--shell-line); }
.chip {
  display: block;
  width: 100%;
  text-align: left;
  border: 1px solid transparent;
  border-left: 3px solid var(--ci);
  border-radius: 5px;
  padding: 3px 6px;
  font-size: 10.5px;
  line-height: 1.3;
  cursor: pointer;
  color: var(--shell-ink2);
  background: var(--card);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chip:hover { border-color: var(--shell-ink3); }
/* Anchor filled, Play outlined, Watch faint. The band has to be legible at
   10px in a cell 90px wide, which rules out a pill — so it is carried by the
   chip's own weight instead. */
.chip.anchor { background: color-mix(in srgb, var(--ci) 15%, var(--card)); font-weight: 620; color: var(--shell-ink); }
.chip.play   { font-weight: 560; }
.chip.watch  { opacity: .62; font-size: 10px; }
.chip.skip   { opacity: .42; font-size: 10px; }
.wall-more {
  border: none;
  background: none;
  padding: 1px 6px;
  font-family: var(--mono);
  font-size: 8.5px;
  letter-spacing: .08em;
  color: var(--shell-ink3);
  cursor: pointer;
  text-align: left;
}
.wall-more:hover { color: var(--shell-ink); }

/* ============================================================
   02 — THE RANKED BRIEF
   ============================================================ */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 18px; }
.tile {
  padding: 13px 15px 14px;
  border-radius: 14px;
  background: var(--card);
  border: 1px solid var(--shell-line);
  box-shadow: 0 1px 2px var(--a04), 0 14px 38px var(--a06);
  border-top: 3px solid var(--tc, var(--shell-ink3));
}
.tile .k {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--tc, var(--shell-ink3));
}
.tile .v { font-size: 30px; font-weight: 680; letter-spacing: -.03em; line-height: 1.1; margin-top: 4px; }
.tile .d { font-size: 11.5px; color: var(--shell-ink3); margin-top: 3px; line-height: 1.4; }

.rank { display: flex; flex-direction: column; gap: 5px; }
.rk {
  border: 1px solid var(--shell-line);
  border-radius: 12px;
  background: var(--card);
  overflow: hidden;
}
.rk-hd {
  display: grid;
  grid-template-columns: 34px 46px minmax(0, 1fr) auto auto auto;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 9px 13px;
  border: none;
  background: none;
  text-align: left;
  cursor: pointer;
  color: inherit;
}
.rk-hd:hover { background: var(--a04); }
.rk-no { font-family: var(--mono); font-size: 10.5px; color: var(--shell-ink3); }
/* The score, as a number that is also a bar. Neither alone works: the number
   is exact and unscannable, the bar is scannable and imprecise. */
.rk-sc { position: relative; }
.rk-sc b { font-size: 17px; font-weight: 680; letter-spacing: -.02em; }
.rk-sc i {
  display: block;
  height: 3px;
  border-radius: 2px;
  margin-top: 2px;
  background: var(--bc, var(--shell-ink3));
}
.rk-nm { min-width: 0; }
.rk-nm .t { font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; display: block; }
.rk-nm .s {
  display: block;
  margin-top: 2px;
  font-size: 11px;
  color: var(--shell-ink3);
}
.rk-nm .s .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; background: var(--ci); }
.rk-dt { font-family: var(--mono); font-size: 10.5px; color: var(--shell-ink3); white-space: nowrap; }
.rk-cv { font-family: var(--mono); font-size: 14px; color: var(--shell-ink3); }

/* The five components, opened. This is the argument — the row above it is only
   the headline — so it gets the well treatment rather than more white. */
.rk-bd { padding: 4px 13px 14px; background: var(--sunken); border-top: 1px solid var(--shell-line); }
.parts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 18px; padding-top: 11px; }
.part .pk {
  display: flex;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--shell-ink3);
}
.part .pk b { color: var(--shell-ink); font-size: 10.5px; letter-spacing: 0; }
.part .pb { height: 5px; border-radius: 3px; background: var(--a08); margin-top: 4px; overflow: hidden; }
.part .pb i { display: block; height: 100%; border-radius: 3px; background: var(--pc, var(--shell-ink3)); }
.part .pw { font-size: 10.5px; color: var(--shell-ink3); margin-top: 3px; line-height: 1.4; }
.rk-eq {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px dashed var(--shell-line);
  font-family: var(--mono);
  font-size: 10.5px;
  line-height: 1.6;
  color: var(--shell-ink3);
}
.rk-eq b { color: var(--shell-ink); }
.rk-meta { margin-top: 8px; font-size: 11.5px; color: var(--shell-ink3); line-height: 1.5; }

.more {
  margin: 14px auto 0;
  display: block;
  height: 34px;

  background: var(--card);

  font-weight: 700;
  letter-spacing: .12em;

}

/* ============================================================
   03 — THE RIBBON
   ============================================================ */
.rib { min-width: 1100px; }
.rib-ax {
  position: sticky;
  top: 0;
  z-index: 5;
  display: grid;
  grid-template-columns: 132px minmax(0, 1fr);

  padding-bottom: 8px;
}
.rib-ax .mos { display: grid; }
.rib-ax .mo {
  border-left: 1px solid var(--shell-line);
  padding: 4px 0 4px 7px;
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--shell-ink3);
}
.rib-ax .mo:first-child { border-left: none; }
.rib-lane { display: grid; grid-template-columns: 132px minmax(0, 1fr); align-items: stretch; }
.rib-lane + .rib-lane { border-top: 1px solid var(--shell-line); }
.rib-lb {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 10px 8px 2px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--shell-ink2);
}
.rib-lb .sw { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--ci); }
.rib-tr { position: relative; padding: 6px 0; }
/* The month gridlines, drawn behind the bars rather than as elements between
   them, so a bar can cross a boundary — which is the whole reason a ribbon
   beats a grid for this data. */
.rib-grid { position: absolute; inset: 0; display: grid; pointer-events: none; }
.rib-grid span { border-left: 1px solid var(--shell-line); }
.rib-grid span:first-child { border-left: none; }
.rib-sub { position: relative; height: 20px; }
.bar {
  position: absolute;
  top: 2px;
  height: 16px;
  border-radius: 5px;
  border: 1px solid transparent;
  padding: 0 6px;
  font-size: 10px;
  line-height: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  color: var(--on-fill);
  background: var(--c);
}
.bar.play  { background: color-mix(in srgb, var(--ci) 22%, var(--card)); color: var(--shell-ink); border-color: color-mix(in srgb, var(--ci) 55%, transparent); }
.bar.watch { background: transparent; color: var(--shell-ink3); border-color: color-mix(in srgb, var(--ci) 48%, transparent); }
.bar.skip  { background: transparent; color: var(--shell-ink3); border-color: var(--shell-line); opacity: .55; }
.bar:hover { outline: 2px solid var(--shell-ink); outline-offset: 1px; z-index: 3; }
/* A single-day moment has no width to give a label, so it is a tick and the
   name is in the tooltip. Drawing it as a 1px bar with text clipped to nothing
   was worse: it looked like a rendering fault. */
.bar.tick { padding: 0; min-width: 5px; border-radius: 3px; }

.rib-cong { margin-top: 18px; }
.cong-wrap { display: grid; grid-template-columns: 132px minmax(0, 1fr); align-items: end; }
.cong-bars { display: flex; align-items: flex-end; gap: 1px; height: 62px; }
.cong-bars i { flex: 1 1 0; border-radius: 2px 2px 0 0; background: var(--cb, var(--a16)); min-height: 2px; }

/* ============================================================
   04 — THE PRESSURE MAP
   ============================================================ */
.pm { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.pm-grid { min-width: 0; overflow-x: auto; }
.pm-row { display: grid; grid-template-columns: 132px repeat(var(--weeks), minmax(9px, 1fr)); gap: 2px; align-items: center; }
.pm-row + .pm-row { margin-top: 2px; }
.pm-lb { display: flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 600; color: var(--shell-ink2); padding-right: 8px; }
.pm-lb .sw { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--ci); }
.pm-cell {
  height: 22px;
  border-radius: 3px;
  border: none;
  padding: 0;
  cursor: pointer;
  background: color-mix(in srgb, var(--ci) var(--t, 0%), transparent);
}
.pm-cell.zero { background: transparent; box-shadow: inset 0 0 0 1px var(--a06); cursor: default; }
.pm-cell:hover:not(.zero) { outline: 2px solid var(--shell-ink); outline-offset: 1px; }
.pm-cell.sel { outline: 2px solid var(--shell-ink); outline-offset: 1px; }
.pm-mos { display: grid; grid-template-columns: 132px minmax(0, 1fr); margin-bottom: 6px; position: sticky; top: 0; background: var(--shell); z-index: 4; padding-bottom: 4px; }
.pm-mos .mos { display: grid; }
.pm-mos .mo {
  border-left: 1px solid var(--shell-line);

  font-size: 9px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--shell-ink3);
}
.pm-mos .mo:first-child { border-left: none; }

.pm-side { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 0; }
.panel {
  border: 1px solid var(--shell-line);

}
.panel.eg { background: var(--eg); border-color: var(--eg-line); box-shadow: none; }
.panel h3 {
  margin: 0 0 3px;

}
.panel .sub { margin: 0 0 11px; font-size: 11.5px; line-height: 1.5; color: var(--shell-ink3); }
.panel ol, .panel ul { margin: 0; padding: 0; list-style: none; }
.uc { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--shell-line); }
.uc:first-child { border-top: none; padding-top: 0; }
.uc .n { font-family: var(--mono); font-size: 10px; color: var(--shell-ink3); flex: none; width: 16px; }

.uc .m b { color: var(--pill-green); }

   ============================================================ */
.io { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
.col { border-radius: 14px; border: 1px solid var(--shell-line); background: var(--card); display: flex; flex-direction: column; min-height: 260px; }

/* ── mockups/data/relevance.js ── */
/* WHAT 'HIGH RELEVANCE' MEANS — a proposed methodology.

   The logic here is real and is what I would ship. The INPUTS it reads are
   placeholders (see audiences.js, and `scaleOf` below), so treat the numbers
   as illustrative and the model as the actual proposal.

   The rule the model is built around: a planner has to be able to argue with
   a score. So relevance is never a bare number — it is five named components
   that each answer a question a planner would otherwise ask out loud, and the
   UI always opens them up.

     AFFINITY      Does this audience care?          weight .50
     SCALE         How many of them show up?          weight .20
     ACTIONABILITY Can we actually buy into it?       weight .15
     TIMING        Is the date firm enough to plan?   weight .15
     CONGESTION    How loud is everything else?       multiplier, up to -25%

   Affinity is the driver and the thing that changes per audience — the other
   four are properties of the moment and are the same for everyone. That is
   deliberate: it keeps the audience switch honest. Flipping the rail should
   reorder the year because the audience cares about different things, not
   because the model quietly re-weighted itself.

   WHY .50 AND NOT .40. The first cut of this weighted affinity at .40, which
   left 60% of every score identical for all six audiences — so the Oscars came
   out top for Gen Z, for families AND for tech buyers, because a big, firmly
   dated, buyable moment wins on three terms out of four no matter who is
   watching. An audience switch that returns the same answer is not an audience
   switch. Affinity carries the majority now, and it is run through a curve
   (see `affinityOf`) rather than a straight rescale, because a flat map put
   every real-world index between 70 and 160 into a 35–80 band and flattened
   the only term that was supposed to vary.

   Congestion is a MULTIPLIER rather than a sixth weighted term because it is
   not a virtue of the moment, it is a tax on it. A moment that is perfect on
   the other four and lands in the loudest week of the year is still worth
   less than the same moment in a quiet one — but it never drops out of the
   running, which a subtractive term would let it do.

   Congestion is also the term that answers the Cultural Playground question
   the LTP process actually asks — "what is the moment nobody in the category
   has claimed?" — so it is surfaced in the UI on its own, not just folded
   into the total.                                                            */

/* ---------- the four moment-side components ---------- */

/* SCALE. Placeholder: a keyword ladder over the moment name, floored by
   category and nudged by whether the distributor is a major. In production
   this is one number per moment from the reach model — expected 18+ reach, or
   the buy's own delivery estimate — and this whole function disappears. */
const TENTPOLE = [
  [/super bowl|world cup|olympic/i, 100],
  [/world series|nba finals|stanley cup|playoffs|wimbledon|masters|kentucky derby|indy 500|daytona/i, 86],
  [/oscar|academy award|grammy|emmy|vma|video music award|game awards|met gala/i, 84],
  [/all-star|comic-con|coachella|unpacked|wwdc|ces\b/i, 78],
  [/thanksgiving|christmas|halloween|new year|black friday|prime day|mother's day|father's day/i, 82],
  [/final season|series finale|s\d+ finale/i, 66],
  [/world tour|tour\b/i, 60],
  [/album release/i, 54]
];
const CAT_SCALE = {
  'Sports': 62, 'Holidays': 74, 'Movies': 58, 'TV & Streaming': 52,
  'Music': 48, 'Tours & Concerts': 50, 'Gaming': 52,
  'Fashion & Awards': 60, 'Tech': 54, 'Culture': 56
};
const MAJORS = /disney|netflix|warner|nbcu|amazon|paramount|sony|fox|apple|umg|google|samsung|nintendo/i;

function scaleOf(m) {
  let s = CAT_SCALE[m.cat] ?? 50;
  for (const [re, v] of TENTPOLE) if (re.test(m.name)) { s = Math.max(s, v); break; }
  if (MAJORS.test(m.plat || '') || MAJORS.test(m.src || '')) s += 6;
  if (m.type === 'Evergreen') s += 4;               // returns every year, so it is known
  return Math.max(0, Math.min(100, s));
}

/* ACTIONABILITY. Can a plan actually enter this moment? A named distributor is
   a door; a declared sponsorship is an open one. A moment with neither is
   something you talk around, not something you buy. */
function actionabilityOf(m) {
  let a = 30;
  if (m.plat) a += 28;
  if (m.spons) a += 26;
  if (m.pas && m.pas.length) a += 10;
  if (m.type === 'Evergreen') a += 12;              // a repeating moment can be planned a year out
  return Math.max(0, Math.min(100, a));
}

/* TIMING. Straight off the sheet's own Date Confirmation column, which is the
   most honest field in the file. A window is plannable; a year is a placeholder
   that means December 31st; TBD cannot be flighted against at all. */
const TIMING = { 'Confirmed Date': 100, 'Confirmed Window': 80, 'Confirmed Year': 45, 'TBD': 15 };
function timingOf(m) { return TIMING[m.conf] ?? 40; }

/* An entity override has to match a WHOLE WORD, not a substring. The first cut
   tested `new RegExp(key, 'i')`, and "CES" duly matched the "ces" inside
   "Academy of Motion Picture Arts and Sciences" — which handed the Oscars a
   190 tech index and made them the single most relevant moment of the year for
   an audience that does not watch them. A three-letter key against 491 free-
   text names will always find something; the boundaries are not optional.

   Left as a named function rather than inlined because it is the piece most
   likely to need a test the day a real entity list arrives. */
function entityHits(key, m) {
  const re = new RegExp('(^|[^A-Za-z0-9])' + key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^A-Za-z0-9]|$)', 'i');
  return re.test(m.name) || re.test(m.src || '') || re.test(m.plat || '');
}

/* AFFINITY. Category index first, then any entity override that matches the
   moment's name or its source — an override is a sharper read, so it wins.

   The index is on a 100 base, and real cuts cluster hard: almost everything
   lands between 70 and 160, with only a handful of true passions above that.
   A straight rescale (index/200) maps that cluster into 35–80 and throws away
   most of the separation, so the curve below stretches the middle instead —
   100 sits at 50, and each 50 points of index is worth roughly 22 points of
   score until it saturates. An index of 100 means "no different from the
   population", and the model should treat it as exactly the midpoint. */
function affinityOf(m, aud) {
  let idx = aud.aff[m.cat] ?? 100;
  for (const [key, v] of Object.entries(aud.ent || {})) {
    if (entityHits(key, m)) idx = Math.max(idx, v);
  }
  /* Logistic on log-index, centred on 100. Monotonic, saturating at both ends,
     and steepest exactly where the data actually sits. */
  const t = Math.log(Math.max(20, idx) / 100) / Math.log(2);   // octaves above/below par
  return Math.max(0, Math.min(100, 100 / (1 + Math.exp(-2.1 * t))));
}

/* CONGESTION. How much else is fighting for the same week — everything, at
   quarter weight, plus same-category moments at full weight, because a
   category rival costs you more than a moment in a different world. Scaled so
   a typical week sits low and the Christmas fortnight sits high. */
function congestionIndex(moments) {
  const byWeek = new Map();
  for (const m of moments) {
    const k = weekKey(m.start);
    if (!byWeek.has(k)) byWeek.set(k, []);
    byWeek.get(k).push(m);
  }
  const idx = new Map();
  for (const m of moments) {
    const peers = byWeek.get(weekKey(m.start)) || [];
    const same = peers.filter(p => p.cat === m.cat).length - 1;
    const other = peers.length - 1 - same;
    idx.set(m.id, Math.max(0, Math.min(100, (same * 9 + other * 2.2))));
  }
  return idx;
}

function weekKey(iso) {
  const d = new Date(iso + 'T00:00:00Z');
  const day = (d.getUTCDay() + 6) % 7;                 // Monday = 0
  d.setUTCDate(d.getUTCDate() - day);
  return d.toISOString().slice(0, 10);
}

/* ---------- the score ---------- */

const WEIGHTS = { aff: 0.50, scale: 0.20, act: 0.15, tim: 0.15 };
const CONGESTION_MAX = 0.25;

/* Four bands, not a number. A planner does not act on 71 versus 68 — they act
   on "this is an anchor" versus "this is a thing we watch". The names are the
   decision the band asks for.

     ANCHOR  build a campaign beat on it
     PLAY    buy into it with what already exists
     WATCH   worth knowing, not worth a line item
     SKIP    say out loud that we are not doing it                            */
const BANDS = [
  { id: 'anchor', label: 'Anchor', min: 72, color: '#0B7A67', note: 'Build a beat on it.' },
  { id: 'play',   label: 'Play',   min: 56, color: '#1A67D2', note: 'Buy in with what exists.' },
  { id: 'watch',  label: 'Watch',  min: 40, color: '#946200', note: 'Know about it. No line item.' },
  { id: 'skip',   label: 'Skip',   min: 0,  color: '#5C6279', note: 'Say out loud we are not doing it.' }
];
const bandOf = s => BANDS.find(b => s >= b.min) || BANDS[BANDS.length - 1];

function scoreMoments(moments, aud) {
  const cong = congestionIndex(moments);
  return moments.map(m => {
    const parts = {
      aff:   affinityOf(m, aud),
      scale: scaleOf(m),
      act:   actionabilityOf(m),
      tim:   timingOf(m),
      cong:  cong.get(m.id) ?? 0
    };
    const base = parts.aff * WEIGHTS.aff + parts.scale * WEIGHTS.scale
               + parts.act * WEIGHTS.act + parts.tim * WEIGHTS.tim;
    const score = Math.round(base * (1 - (parts.cong / 100) * CONGESTION_MAX));
    return { ...m, parts, score, band: bandOf(score) };
  });
}

/* The unclaimed moment. Not the highest score — the highest affinity sitting in
   the quietest week, which is a different and more interesting question, and
   the one stage 6.2 actually asks. */
function unclaimed(scored) {
  return [...scored]
    .filter(m => m.parts.aff >= 55 && m.parts.tim >= 80)
    .sort((a, b) => (b.parts.aff - b.parts.cong * 1.4) - (a.parts.aff - a.parts.cong * 1.4))
    .slice(0, 6);
}

/* LTP Moments — five directions over one state.

   Every direction reads the same three things: the audience selected in the
   rail, the categories left switched on, and the twelve-month window. Nothing
   is per-direction except how it draws — so switching directions never changes
   what is being argued, only how it is shown, which is the only way five
   mockups can be compared honestly. */



/* ---------- window: the planning year opens in July 2026 ---------- */
const WIN_START = '2026-07-01';
const WIN_MONTHS = 12;

const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function monthList() {
  const out = [];
  let y = +WIN_START.slice(0, 4), m = +WIN_START.slice(5, 7) - 1;
  for (let i = 0; i < WIN_MONTHS; i++) {
    out.push({ y, m, key: `${y}-${String(m + 1).padStart(2, '0')}`, label: MO[m], yy: String(y).slice(2) });
    if (++m > 11) { m = 0; y++; }
  }
  return out;
}
const MONTHS = monthList();
const WIN_END = (() => {
  const last = MONTHS[MONTHS.length - 1];
  return `${last.y}-${String(last.m + 1).padStart(2, '0')}-${new Date(Date.UTC(last.y, last.m + 1, 0)).getUTCDate()}`;
})();

const dayNo = iso => Math.round((Date.parse(iso + 'T00:00:00Z') - Date.parse(WIN_START + 'T00:00:00Z')) / 86400000);
const WIN_DAYS = dayNo(WIN_END) + 1;

const CATS = [...new Set(MOMENTS.map(m => m.cat))]
  .sort((a, b) => MOMENTS.filter(m => m.cat === b).length - MOMENTS.filter(m => m.cat === a).length);

/* Only what the window actually holds. A moment that starts before July and is
   still running on day one is kept — it is a moment you plan against. */
const IN_WINDOW = MOMENTS.filter(m => m.start <= WIN_END && m.end >= WIN_START);

const fmtDate = iso => {
  const [y, m, d] = iso.split('-');
  return `${+d} ${MO[+m - 1]} ${y.slice(2)}`;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- state ---------- */
/* Direction and audience live in the hash, so a link carries what you were
   looking at — which is the whole point of five mockups: somebody has to be
   able to send back "03, sports superfans, this bar". */
function fromHash() {
  const m = /^#\/(\d)\/([a-z]+)/.exec(location.hash || '');
  if (!m) return {};
  const dir = +m[1], aud = m[2];
  return {
    dir: dir >= 1 && dir <= 5 ? dir : undefined,
    aud: AUDIENCES.some(a => a.id === aud) ? aud : undefined
  };
}
const H = fromHash();

const S = {
  aud: H.aud || AUDIENCES[0].id,
  dir: H.dir || 1,
  off: new Set(),          // categories switched off
  showWatch: false,        // direction 01: draw the Watch band too
  rankShown: 25,
  pmSel: null,             // pressure map: selected [cat, weekIndex]
  io: null                 // in/out board: id -> 'in' | 'und' | 'out'
};

const audience = () => AUDIENCES.find(a => a.id === S.aud);

let SCORED = [];
function recompute() {
  SCORED = scoreMoments(IN_WINDOW, audience());

}
const visible = () => SCORED.filter(m => !S.off.has(m.cat));

/* ============================================================
   01 — THE YEAR WALL
   ============================================================ */
function drawWall() {
  const v = visible();
  const min = S.showWatch ? 40 : 56;
  const shown = v.filter(m => m.score >= min);

  const byMonth = new Map();
  for (const m of shown) {
    const k = m.start < WIN_START ? MONTHS[0].key : m.start.slice(0, 7);
    if (!byMonth.has(k)) byMonth.set(k, []);
    byMonth.get(k).push(m);
  }
  const weight = MONTHS.map(mo => (byMonth.get(mo.key) || []).reduce((s, m) => s + m.score, 0));
  const wMax = Math.max(1, ...weight);

  const cats = CATS.filter(c => !S.off.has(c));
  const cell = (c, mo) => {
    const list = (byMonth.get(mo.key) || []).filter(m => m.cat === c).sort((a, b) => b.score - a.score);
    if (!list.length) return `<div class="wall-cell empty"></div>`;
    const cap = 4;
    const head = list.slice(0, cap).map(m => chip(m)).join('');
    const rest = list.length > cap
      ? `<button class="wall-more" data-more="${esc(c)}|${mo.key}">+${list.length - cap} more</button>` : '';
    return `<div class="wall-cell">${head}${rest}</div>`;
  };

  return `
    <div class="legend">
      ${bandLegend()}
      <span class="li" style="margin-left:auto">
        <button class="mk-tog" id="wallWatch" style="background:var(--card);color:var(--shell-ink3);border-color:var(--shell-line)">

        <div></div>
        ${MONTHS.map((mo, i) => `
          <div class="wall-mo">
            <span class="m">${mo.label}</span><span class="y">'${mo.yy}</span>
            <div class="bar"><i style="width:${Math.round(weight[i] / wMax * 100)}%"></i></div>
          </div>`).join('')}
      </div>
      ${cats.map(c => `
        <div class="wall-row">
          <div class="wall-cat">
            <span class="sw" style="--c:${CAT_COLOR[c]}"></span>
            <span>${esc(c)}</span>
            <span class="n">${shown.filter(m => m.cat === c).length}</span>
          </div>
          ${MONTHS.map(mo => cell(c, mo)).join('')}
        </div>`).join('')}
    </div>`;
}
const chip = m =>

    <div class="part">
      <div class="pk"><span>${p.k}${p.w ? ` · ${Math.round(p.w * 100)}%` : ' · −25% max'}</span><b>${Math.round(m.parts[k])}</b></div>
      <div class="pb"><i style="width:${Math.round(m.parts[k])}%;--pc:${p.c}"></i></div>
      <div class="pw">${p.why}</div>
    </div>`).join('')}</div>`;
}

function drawRank() {
  const v = visible().sort((a, b) => b.score - a.score || a.start.localeCompare(b.start));
  const list = v.slice(0, S.rankShown);
  const tile = (b) => {
    const n = v.filter(m => m.band.id === b.id).length;
    return `<div class="tile" style="--tc:${b.color}">
      <div class="k">${b.label}</div><div class="v">${n}</div><div class="d">${b.note}</div></div>`;
  };
  return `
    <div class="tiles">${BANDS.map(tile).join('')}</div>
    <div class="rank">${list.map((m, i) => rankRow(m, i + 1)).join('')}</div>
    ${S.rankShown < v.length ? `<button class="more" id="rankMore">Show 25 more — ${v.length - S.rankShown} left</button>` : ''}`;
}

function rankRow(m, n) {
  return `
  <div class="rk" data-rk="${m.id}">
    <button class="rk-hd" type="button" data-open="${m.id}" aria-expanded="false">
      <span class="rk-no">${String(n).padStart(2, '0')}</span>
      <span class="rk-sc"><b>${m.score}</b><i style="width:${m.score}%;--bc:${m.band.color}"></i></span>
      <span class="rk-nm">
        <span class="t">${esc(m.name)}</span>
        <span class="s"><span class="dot" style="--c:${CAT_COLOR[m.cat]}"></span>${esc(m.cat)}${m.plat ? ' · ' + esc(m.plat) : ''}</span>
      </span>
      <span class="rk-dt">${fmtDate(m.start)}${m.end !== m.start ? ' → ' + fmtDate(m.end) : ''}</span>
      <span class="bandpill ${m.band.id}">${m.band.label}</span>
      <span class="rk-cv">▾</span>
    </button>
    <div class="rk-bd" hidden>
      ${partsBlock(m)}
      <div class="rk-eq">
        (${Math.round(m.parts.aff)}×.40 + ${Math.round(m.parts.scale)}×.25 + ${Math.round(m.parts.act)}×.20 + ${Math.round(m.parts.tim)}×.15)
        × (1 − ${(m.parts.cong / 100 * CONGESTION_MAX).toFixed(2)}) = <b>${m.score}</b>
      </div>
      <div class="rk-meta">
        ${esc(m.conf)} · ${esc(m.type)}${m.src ? ' · ' + esc(m.src) : ''}${m.spons ? ' · sponsorship: ' + esc(m.spons) : ''}
        ${m.notes ? '<br>' + esc(m.notes) : ''}
      </div>
    </div>
  </div>`;
}

/* ============================================================
   03 — THE RIBBON
   ============================================================ */
function drawRibbon() {
  const v = visible().filter(m => S.showWatch ? m.score >= 40 : m.score >= 56);
  const cats = CATS.filter(c => !S.off.has(c));
  const pct = d => (d / WIN_DAYS) * 100;

  const lane = c => {
    const list = v.filter(m => m.cat === c).sort((a, b) => a.start.localeCompare(b.start));
    /* Greedy packing into sub-rows: a bar goes in the first row whose last bar
       has already finished, with a small gutter so two touching moments do not
       read as one. Three rows maximum — beyond that the lane stops being a
       lane and the reader should be in the Pressure Map instead. */
    const rows = [];
    for (const m of list) {
      const s = Math.max(0, dayNo(m.start));
      const e = Math.min(WIN_DAYS, dayNo(m.end) + 1);
      const w = Math.max(e - s, 3);
      let r = rows.find(row => row.end <= s - 4);
      if (!r) { if (rows.length >= 3) { r = rows[rows.length - 1]; } else { r = { end: 0, bars: [] }; rows.push(r); } }
      r.end = Math.max(r.end, s + w);
      r.bars.push({ m, s, w });
    }
    if (!rows.length) rows.push({ bars: [] });
    return `
      <div class="rib-lane">
        <div class="rib-lb"><span class="sw" style="--c:${CAT_COLOR[c]}"></span>${esc(c)}</div>
        <div class="rib-tr">
          <div class="rib-grid" style="grid-template-columns:repeat(${MONTHS.length},1fr)">${MONTHS.map(() => '<span></span>').join('')}</div>
          ${rows.map(row => `<div class="rib-sub">${row.bars.map(b => {
            const tick = b.w <= 6;
            return `<button class="bar ${b.m.band.id}${tick ? ' tick' : ''}"
              data-id="${b.m.id}" style="--c:${CAT_COLOR[c]};left:${pct(b.s)}%;width:${pct(b.w)}%"
              title="${esc(b.m.name)} — ${b.m.score}">${tick ? '' : esc(b.m.name)}</button>`;
          }).join('')}</div>`).join('')}
        </div>
      </div>`;
  };

  /* Congestion, week by week. Same input the score's congestion term reads,
     drawn on its own — the quiet weeks are the point, and they are invisible
     inside a total. */
  const weeks = weekAxis();
  const load = weeks.map(w => visible().filter(m => weekKey(m.start < WIN_START ? WIN_START : m.start) === w.key)
    .reduce((s, m) => s + m.parts.aff, 0));
  const lMax = Math.max(1, ...load);

  return `
    <div class="legend">${bandLegend()}
      <span class="li" style="margin-left:auto">
        <button class="mk-tog" id="wallWatch" style="background:var(--card);color:var(--shell-ink3);border-color:var(--shell-line)">
          ${S.showWatch ? '✓ ' : ''}Include Watch</button>
      </span>
    </div>
    <div class="rib">
      <div class="rib-ax">
        <div></div>
        <div class="mos" style="grid-template-columns:repeat(${MONTHS.length},1fr)">
          ${MONTHS.map(mo => `<div class="mo">${mo.label} '${mo.yy}</div>`).join('')}
        </div>
      </div>
      ${cats.map(lane).join('')}
      <div class="rib-cong">
        <div class="legend" style="margin-bottom:8px">
          <span class="li"><b>Weekly load</b> — total audience affinity landing in each week. The troughs are where an unclaimed moment lives.</span>
        </div>
        <div class="cong-wrap">
          <div class="rib-lb" style="align-self:end">${weeks.length} weeks</div>
          <div class="cong-bars">${load.map((l, i) => {
            const h = Math.round(l / lMax * 100);
            return `<i style="height:${Math.max(3, h)}%;--cb:${h > 66 ? '#C5221F' : h > 33 ? '#946200' : '#0B7A67'}"
              title="${weeks[i].label} — load ${Math.round(l)}"></i>`;
          }).join('')}</div>
        </div>
      </div>
    </div>`;
}

function weekAxis() {
  const out = [];
  let d = new Date(WIN_START + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
  const end = new Date(WIN_END + 'T00:00:00Z');
  while (d <= end) {
    const key = d.toISOString().slice(0, 10);
    out.push({ key, label: `${d.getUTCDate()} ${MO[d.getUTCMonth()]}`, m: d.getUTCMonth(), y: d.getUTCFullYear() });
    d = new Date(d.getTime() + 7 * 86400000);
  }
  return out;
}

/* ============================================================
   04 — THE PRESSURE MAP
   ============================================================ */
function drawPressure() {
  const v = visible();
  const weeks = weekAxis();
  const cats = CATS.filter(c => !S.off.has(c));
  const key = (c, w) => c + '|' + w;
  const cellv = new Map();
  for (const m of v) {
    const k = key(m.cat, weekKey(m.start < WIN_START ? WIN_START : m.start));
    cellv.set(k, (cellv.get(k) || 0) + m.score);
  }
  const vMax = Math.max(1, ...cellv.values());

  /* Month rules across the top rather than a week label every column — 52
     labels do not fit and would not be read if they did. */
  const monthSpan = MONTHS.map(mo => weeks.filter(w => `${w.y}-${String(w.m + 1).padStart(2, '0')}` === mo.key).length);

  const uc = unclaimed(v);

  return `
    <div class="legend">
      <span class="li"><b>Ink</b> = total relevance landing in that week, for this audience.</span>
      <span class="li"><b>Empty</b> = nothing this audience has a claim on. That is a finding, not a gap.</span>
    </div>
    <div class="pm">
      <div class="pm-grid">
        <div class="pm-mos">
          <div></div>
          <div class="mos" style="grid-template-columns:${monthSpan.map(s => s + 'fr').join(' ')}">
            ${MONTHS.map(mo => `<div class="mo">${mo.label}</div>`).join('')}
          </div>
        </div>
        <div style="--weeks:${weeks.length}">
        ${cats.map(c => `
          <div class="pm-row">
            <div class="pm-lb"><span class="sw" style="--c:${CAT_COLOR[c]}"></span>${esc(c)}</div>
            ${weeks.map((w, i) => {
              const val = cellv.get(key(c, w.key)) || 0;
              if (!val) return `<button class="pm-cell zero" disabled aria-label="${esc(c)}, ${w.label}: nothing"></button>`;
              const t = Math.min(1, val / vMax);
              const sel = S.pmSel && S.pmSel[0] === c && S.pmSel[1] === i ? ' sel' : '';
              return `<button class="pm-cell${sel}" data-pm="${esc(c)}|${i}"
                style="--c:${CAT_COLOR[c]};--t:${Math.round(18 + t * 82)}%"
                title="${esc(c)} · ${w.label} — ${Math.round(val)}"></button>`;
            }).join('')}
          </div>`).join('')}
        </div>
      </div>
      <div class="pm-side">
        <div class="panel eg">
          <h3>The unclaimed moment</h3>
          <p class="sub">Highest affinity sitting in the quietest weeks — not the highest score. This is the question stage 6.2 asks that a ranked list will never answer.</p>
          ${uc.map((m, i) => `
            <div class="uc">
              <span class="n">${String(i + 1).padStart(2, '0')}</span>
              <span>
                <span class="t">${esc(m.name)}</span>
                <span class="m">${fmtDate(m.start)} · affinity <b>${Math.round(m.parts.aff)}</b> · congestion ${Math.round(m.parts.cong)}</span>
              </span>
            </div>`).join('')}
        </div>
        <div class="panel" id="pmDetail">
          <h3>Week detail</h3>
          <p class="sub">Pick a cell to see what lands in it.</p>
        </div>
      </div>
    </div>`;
}

function pmDetail() {
  const el = document.getElementById('pmDetail');
  if (!el || !S.pmSel) return;
  const [c, i] = S.pmSel;
  const weeks = weekAxis();
  const w = weeks[i];
  const list = visible().filter(m => m.cat === c && weekKey(m.start < WIN_START ? WIN_START : m.start) === w.key)
    .sort((a, b) => b.score - a.score);
  el.innerHTML = `
    <h3>${esc(c)} · week of ${w.label}</h3>
    <p class="sub">${list.length} moment${list.length === 1 ? '' : 's'}, ${Math.round(list.reduce((s, m) => s + m.score, 0))} total relevance.</p>
    ${list.map(m => `
      <div class="uc">
        <span class="n">${m.score}</span>
        <span><span class="t">${esc(m.name)}</span>
        <span class="m">${fmtDate(m.start)} · ${esc(m.conf)}</span></span>
      </div>`).join('')}`;
}

/* ============================================================
   05 — THE IN / OUT BOARD
   ============================================================ */
function seedIO() {
  S.io = {};
  for (const m of visible()) {
    S.io[m.id] = m.band.id === 'anchor' ? 'in' : m.band.id === 'skip' ? 'out' : 'und';
  }
}

function drawIO() {
  if (!S.io) seedIO();
  const v = visible().sort((a, b) => b.score - a.score);
  const lane = id => v.filter(m => (S.io[m.id] || 'und') === id);
  const cols = [
    { id: 'in',  k: 'Moments in',  d: 'We are buying into these. Each one needs a line in the plan.' },
    { id: 'und', k: 'Undecided',   d: 'Still arguable. Nothing leaves this board undecided.' },
    { id: 'out', k: 'Moments out', d: 'Deliberately skipped, and said out loud so nobody re-opens it in November.' }
  ];
  const card = m => `
    <div class="mcard" style="--c:${CAT_COLOR[m.cat]}">
      <div class="t">${esc(m.name)}</div>
      <div class="r">
        <span class="dt">${fmtDate(m.start)}</span>
        <span class="bandpill ${m.band.id}">${m.band.label}</span>
        <span class="sc">${m.score}</span>
      </div>
      <div class="mv">
        ${['in', 'und', 'out'].filter(t => t !== (S.io[m.id] || 'und'))
          .map(t => `<button data-io="${m.id}|${t}" type="button">${t === 'in' ? 'In' : t === 'out' ? 'Out' : 'Undecided'}</button>`).join('')}
      </div>
    </div>`;

  const CAP = 14;
  return `
    <div class="legend">
      <span class="li">Seeded from the score — <b>Anchor → in</b>, <b>Skip → out</b>, everything else open — and then argued with. The seed is a starting position, not a verdict.</span>
    </div>
    <div class="io">
      ${cols.map(c => {
        const list = lane(c.id);
        return `<div class="col ${c.id}">
          <div class="col-hd"><div class="k">${c.k}</div><div class="c">${list.length}</div><div class="d">${c.d}</div></div>
          <div class="col-bd">
            ${list.length ? list.slice(0, CAP).map(card).join('') : '<div class="col-empty">Nothing here yet.</div>'}
            ${list.length > CAP ? `<div class="col-empty">+${list.length - CAP} more below the fold</div>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="io-foot">
      <div class="feed"><span class="ar">→</span><span>
        <span class="k">Feeds 6.3</span><span class="t">Big Ideas &amp; Partnerships</span>
        <span class="d">The in-list is the shortlist a partnership is proposed against.</span></span></div>
      <div class="feed"><span class="ar">→</span><span>
        <span class="k">Feeds step 03</span><span class="t">Flighting</span>
        <span class="d">Dates and weights, straight into the annual scenario.</span></span></div>
      <div class="feed"><span class="ar">→</span><span>
        <span class="k">Produces</span><span class="t">The Calendar</span>
        <span class="d">Which is what stage 6.2 is defined as producing.</span></span></div>
    </div>`;
}

/* ============================================================
   POPOVER — shared by the wall and the ribbon
   ============================================================ */
let popEl = null;
function closePop() { if (popEl) { popEl.remove(); popEl = null; } }
function openPop(m, anchor) {
  closePop();
  const r = anchor.getBoundingClientRect();
  popEl = document.createElement('div');
  popEl.className = 'pop';
  popEl.innerHTML = `
    <div class="t">${esc(m.name)}</div>
    <div class="meta"><span class="dot" style="--c:${CAT_COLOR[m.cat]}"></span>${esc(m.cat)}${m.plat ? ' · ' + esc(m.plat) : ''}<br>
      ${fmtDate(m.start)}${m.end !== m.start ? ' → ' + fmtDate(m.end) : ''} · ${esc(m.conf)}</div>
    <div class="row"><span class="sc">${m.score}</span><span class="bandpill ${m.band.id}">${m.band.label}</span></div>
    ${partsBlock(m)}
    ${m.notes ? `<div class="note">${esc(m.notes)}</div>` : ''}`;
  document.body.appendChild(popEl);
  const w = popEl.offsetWidth, h = popEl.offsetHeight;
  let x = Math.min(window.innerWidth - w - 12, Math.max(12, r.left));
  let y = r.bottom + 8;
  if (y + h > window.innerHeight - 12) y = Math.max(12, r.top - h - 8);
  popEl.style.left = x + 'px';
  popEl.style.top = y + 'px';
}

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  closePop();
  /* replaceState rather than assigning location.hash: this is where you ARE,
     not somewhere you went, and a back button that walks through every rail
     click is worse than one that leaves the page. */
  try { history.replaceState(null, '', `#/${S.dir}/${S.aud}`); } catch (e) { void e; }
  renderRail();
  renderHead();
  const body = document.getElementById('body');
  body.innerHTML = [drawWall, drawRank, drawRibbon, drawPressure, drawIO][S.dir - 1]();
  if (S.dir === 4 && S.pmSel) pmDetail();
  body.scrollTop = 0;
}

/* ---------- one delegated listener ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-aud],[data-cat],[data-dir],[data-id],[data-open],[data-pm],[data-io],[data-more],#rankMore,#wallWatch,#themeTog');
  if (!t) { closePop(); return; }

  if (t.dataset.aud)  { S.aud = t.dataset.aud; recompute(); return render(); }
  if (t.dataset.dir)  { S.dir = +t.dataset.dir; return render(); }
  if (t.dataset.cat)  {
    const c = t.dataset.cat;
    S.off.has(c) ? S.off.delete(c) : S.off.add(c);
    if (S.dir === 5) S.io = null;
    return render();
  }
  if (t.id === 'wallWatch') { S.showWatch = !S.showWatch; return render(); }
  if (t.id === 'rankMore')  { S.rankShown += 25; return render(); }
  if (t.id === 'themeTog')  {
    const cur = document.documentElement.dataset.theme;
    const next = cur === 'dark' ? 'light' : cur === 'light' ? 'dark'
      : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
    document.documentElement.dataset.theme = next;
    t.textContent = next === 'dark' ? '☀ Light' : '☾ Dark';
    return;
  }
  if (t.dataset.more) {
    /* "+7 more" opens the cell rather than paging it: the wall's job is the
       shape of the year, and a cell that grows to eleven rows destroys it for
       every other cell in the row. */
    const [c, mk] = t.dataset.more.split('|');
    const list = visible().filter(m => m.cat === c && m.start.slice(0, 7) === mk && m.score >= (S.showWatch ? 40 : 56))
      .sort((a, b) => b.score - a.score);
    t.parentElement.innerHTML = list.map(chip).join('');
    return;
  }
  if (t.dataset.open) {
    const bd = t.parentElement.querySelector('.rk-bd');
    const open = !bd.hidden;
    bd.hidden = open;
    t.setAttribute('aria-expanded', String(!open));
    t.querySelector('.rk-cv').textContent = open ? '▾' : '▴';
    return;
  }
  if (t.dataset.pm) {
    const [c, i] = t.dataset.pm.split('|');
    S.pmSel = [c, +i];
    document.querySelectorAll('.pm-cell.sel').forEach(x => x.classList.remove('sel'));
    t.classList.add('sel');
    return pmDetail();
  }
  if (t.dataset.io) {
    const [id, to] = t.dataset.io.split('|');
    S.io[id] = to;
    return render();
  }
  if (t.dataset.id) {
    const m = SCORED.find(x => x.id === t.dataset.id);
    if (m) openPop(m, t);
    return;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });
window.addEventListener('resize', closePop, { passive: true });

/* ---------- boot ---------- */
document.getElementById('mkTabs').innerHTML = DIRS.map(d =>
  `<button class="mk-tab" data-dir="${d.n}" type="button"><i>0${d.n}</i>${d.tab}</button>`).join('');
recompute();
render();
</script>
