<title>LTP Moments</title>
<style>
/* LTP Moments — mockups, in the Atlas light family the rest of the LTP tools
   use. Tokens are lifted from ltpstrategy/css/atlas.css unchanged, so a
   component moved between the two keeps its colour and its weight.

   Three theme states, not two: an explicit choice stamps data-theme, and the
   default system setting stamps nothing, so the dark palette is declared twice
   — once behind prefers-color-scheme guarded against an explicit light, and
   once behind the stamp. Nothing below the token blocks declares a colour. */

:root {
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --shell: #EEF0F5;
  --shell-2: #FFFFFF;
  --shell-ink: #14161F;
  --shell-ink2: #3D4256;
  --shell-ink3: #5C6279;
  --shell-line: rgba(20, 22, 31, .12);

  /* What strip.css asks for. That file is copied between the planning modules
     byte for byte and each of them names its colours differently, so it
     declares what it needs and this says which of ours those are. Mapped once,
     here, rather than per theme: these are references, so they resolve against
     whatever `--shell-*` is on the root at the time — the dark blocks below
     redefine those and the strip follows. */
  --strip-line: var(--shell-line);
  --strip-ink: var(--shell-ink);
  --strip-ink3: var(--shell-ink3);
  --strip-focus: var(--vi);

  --card: #FFFFFF;
  --sunken: #F7F8FB;
  --well: #EAEEF6;
  --eg: #EAF1FE;
  --eg-line: rgba(66, 133, 244, .22);

  --a04: rgba(20, 22, 31, .04);
  --a06: rgba(20, 22, 31, .06);
  --a08: rgba(20, 22, 31, .08);
  --a12: rgba(20, 22, 31, .12);
  --a16: rgba(20, 22, 31, .16);
  --a22: rgba(20, 22, 31, .22);
  --shadow-a: rgba(20, 22, 31, .28);
  --scrim: rgba(20, 22, 31, .38);

  --g1: #4285F4; --g2: #9B72CB; --g3: #D96570;
  --cy: #0FA98F; --cy-ink: #0B7A68;
  --vi: #6D5DE0; --vi-ink: #4436B8;
  --fwd: #D93025;

  --pill-blue: #1A67D2;  --pill-blue-line: rgba(26, 103, 210, .38);
  --pill-amber: #946200; --pill-amber-line: rgba(148, 98, 0, .38);
  --pill-green: #0B7A67; --pill-green-line: rgba(11, 122, 103, .38);

  --on-fill: #FFFFFF;
  --lede-ink: #262A38;
  --rail-w: 248px;

  /* THE CATEGORY COLOURS DO NOT INVERT — a category's hue is how a reader maps
     one direction onto another, and a hue that moved between themes would break
     that. What moves is the depth they are drawn AT, and only where the colour
     is thin: an 8px swatch, a 3px rule, a hairline border. #0B7A67 is chosen to
     hold as a fill under white type, which it does in both themes; as a dot on
     near-black it disappears.

     So: solid fills keep the colour exactly. Thin uses take `--ci`, which is
     the same hue lifted toward white by an amount that is zero in light. */
  --lift: #FFFFFF;
  --lift-amt: 0%;
}

/* Anything carrying a category colour computes its thin variant once, here,
   rather than each rule mixing its own and drifting. */
.sw, .dot, .bar {
  --ci: color-mix(in srgb, var(--c, currentColor), var(--lift) var(--lift-amt));
}

:root[data-theme="dark"], html[data-theme="dark"] { color-scheme: dark; }
:root:not([data-theme="light"]) { color-scheme: light; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --shell: #0E1014;
    --shell-2: #171A21;
    --shell-ink: #E8EAF0;
    --shell-ink2: #AEB4C6;
    --shell-ink3: #8B92A6;
    --shell-line: rgba(232, 234, 240, .14);
    --card: #171A21;
    --sunken: #1E222B;
    --well: #222736;
    --eg: #17233A;
    --eg-line: rgba(138, 180, 248, .26);
    --a04: rgba(232, 234, 240, .05);
    --a06: rgba(232, 234, 240, .07);
    --a08: rgba(232, 234, 240, .09);
    --a12: rgba(232, 234, 240, .13);
    --a16: rgba(232, 234, 240, .17);
    --a22: rgba(232, 234, 240, .23);
    --shadow-a: rgba(0, 0, 0, .55);
    --scrim: rgba(0, 0, 0, .62);
    --cy: #4FD8C0; --cy-ink: #4FD8C0;
    --vi: #A99BFF; --vi-ink: #A99BFF;
    --pill-blue: #8AB4F8;  --pill-blue-line: rgba(138, 180, 248, .38);
    --pill-amber: #F7C56B; --pill-amber-line: rgba(247, 197, 107, .38);
    --pill-green: #5FD3B4; --pill-green-line: rgba(95, 211, 180, .38);
    --lede-ink: #C6CBDA;
    --lift-amt: 34%;
  }
}
:root[data-theme="dark"] {
  --shell: #0E1014;
  --shell-2: #171A21;
  --shell-ink: #E8EAF0;
  --shell-ink2: #AEB4C6;
  --shell-ink3: #8B92A6;
  --shell-line: rgba(232, 234, 240, .14);
  --card: #171A21;
  --sunken: #1E222B;
  --well: #222736;
  --eg: #17233A;
  --eg-line: rgba(138, 180, 248, .26);
  --a04: rgba(232, 234, 240, .05);
  --a06: rgba(232, 234, 240, .07);
  --a08: rgba(232, 234, 240, .09);
  --a12: rgba(232, 234, 240, .13);
  --a16: rgba(232, 234, 240, .17);
  --a22: rgba(232, 234, 240, .23);
  --shadow-a: rgba(0, 0, 0, .55);
  --scrim: rgba(0, 0, 0, .62);
  --cy: #4FD8C0; --cy-ink: #4FD8C0;
  --vi: #A99BFF; --vi-ink: #A99BFF;
  --pill-blue: #8AB4F8;  --pill-blue-line: rgba(138, 180, 248, .38);
  --pill-amber: #F7C56B; --pill-amber-line: rgba(247, 197, 107, .38);
  --pill-green: #5FD3B4; --pill-green-line: rgba(95, 211, 180, .38);
  --lede-ink: #C6CBDA;
  --lift-amt: 34%;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--shell);
  color: var(--shell-ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font-family: inherit; }

/* ============================================================
   SHELL
   ============================================================ */
.app {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  height: 100dvh;
  min-height: 560px;
}

/* ---------- rail ---------- */
.rail {
  background: var(--shell-2);
  border-right: 1px solid var(--shell-line);
  padding: 18px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow-y: auto;
}
.rl-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  font-size: 16.5px;
  letter-spacing: -.01em;
  line-height: 1.15;
  margin-bottom: 15px;
}
.rl-lg { width: 30px; height: 30px; flex: none; }
.rl-lg svg { width: 30px; height: 30px; border-radius: 9px; display: block; }
.rl-nm { flex: 1 1 auto; min-width: 0; }
.modpill {
  flex: none;
  padding: 2px 7px;
  border: 1px solid var(--shell-line);
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: .1em;
  color: var(--shell-ink3);
  text-decoration: none;
}

.rl-hd {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--shell-ink3);
  margin: 4px 3px 8px;
}
.rl-hd.gap { margin-top: 20px; }

/* The zoom stepper. Three buttons that read as one control, so the minus and
   plus sit tight against the readout between them. */
.zoom { display: flex; align-items: stretch; gap: 0; }
.zoom .tool { border-radius: 0; }
.zoom .tool:first-child { border-radius: 8px 0 0 8px; }
.zoom .tool:last-child { border-radius: 0 8px 8px 0; }
.zoom .tool + .tool { margin-left: -1px; }
.zb { min-width: 26px; font-size: 13px; line-height: 1; }
/* Wide enough for "100%" and "Fit" without the strip jumping as it changes. */
.zrd { min-width: 52px; font-variant-numeric: tabular-nums; }
.zoom .tool[disabled] { opacity: .38; cursor: default; }
.zoom .tool[disabled]:hover { background: none; }

/* A rail group heading is a collapse toggle. Same gesture as the board's
   families, so the caret and the rotation match — a reader learns it once. */
.grp-tog {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 100%;
  padding: 3px 4px;
  border: 0;
  border-radius: 7px;
  background: none;
  cursor: pointer;
  /* .rl-hd sets the mono/uppercase treatment; only the button reset and the
     layout belong here, or the heading stops matching the ones it sits with. */
  font-family: inherit;
  font-size: inherit;
  letter-spacing: inherit;
  text-transform: inherit;
  color: inherit;
}
.grp-tog:hover { background: var(--a04); }
.grp-tog:focus-visible { outline: 2px solid var(--vi); outline-offset: 1px; }
.grp-nm { flex: 1 1 auto; text-align: left; color: var(--gc); }

/* Each group owns a colour, so the three are told apart at a glance rather
   than by reading three similar headings. Carried on the group element as --gc
   and used in three thin places — a dot, the heading, and a rule down the
   rows — never as a fill: the rail's job is to make the SELECTED audience
   obvious, and three coloured blocks would compete with that.

   Lifted in dark exactly as the category colours are, for the same reason: a
   mid-tone hue on near-black disappears at this size. */
.aud-grp { --gci: color-mix(in srgb, var(--gc), var(--lift) var(--lift-amt)); }
.grp-dot {
  flex: none;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--gci);
}
.grp-nm { color: var(--gci); }
/* The rows sit against their group's colour, which is what makes a scrolled
   rail readable — you can see which group you are in without the heading. */
.aud-grp-bd {
  border-left: 2px solid color-mix(in srgb, var(--gci) 34%, transparent);
  margin-left: 5px;
  padding-left: 6px;
}
.aud-grp.shut .aud-grp-bd { border-left: 0; }
/* How many are selected in this group. It stays visible while the group is
   shut, so collapsing can never hide that a group is feeding the board. */
.grp-n { flex: none; opacity: .75; }
.grp-caret {
  flex: none;
  font-size: 8px;
  line-height: 1;
  transition: transform .16s;
  display: inline-block;
}
.aud-grp.shut .grp-caret { transform: rotate(-90deg); }
.aud-grp-bd[hidden] { display: none; }

/* The audience switch. One at a time, and the whole board answers to it — so
   it is a radio in behaviour and reads as one, with the selected row carrying
   the same blue fill the LTP rail uses for the stage you are standing on. */
/* Several audiences can be on at once, so the row reads as a checkbox rather
   than a radio — a tick column that is always there, empty when it is off, so
   the list does not reflow as things are selected. */
.aud {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  width: 100%;
  text-align: left;
  border: 1px solid transparent;
  background: none;
  border-radius: 11px;
  padding: 8px 10px;
  cursor: pointer;
  color: var(--shell-ink2);
  transition: background .16s, color .16s, border-color .16s;
}
.aud:hover { background: var(--a04); }
.aud .tick {
  flex: none;
  width: 15px;
  height: 15px;
  margin-top: 1px;
  border: 1.5px solid var(--shell-line);
  border-radius: 5px;
  font-size: 10px;
  line-height: 12px;
  text-align: center;
  color: transparent;
}
.aud.on .tick {
  background: var(--pill-blue);
  border-color: var(--pill-blue);
  color: #fff;
}
.aud .at { min-width: 0; flex: 1 1 auto; }
.aud .an { font-size: 12.6px; font-weight: 600; line-height: 1.25; display: block; }
.aud .as {
  display: block;
  margin-top: 3px;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: .06em;
  color: var(--shell-ink3);
}
.aud.on {
  background: rgba(66, 133, 244, .12);
  border-color: rgba(66, 133, 244, .28);
  color: var(--pill-blue);
}
.aud.on .an { color: inherit; }
.aud.on .as { color: inherit; opacity: .8; }
/* The last one on cannot be switched off, so it should not offer to be. */
.aud[aria-disabled="true"] { cursor: default; }
.aud[aria-disabled="true"]:hover { background: rgba(66, 133, 244, .12); }
.aud:focus-visible { outline: 2px solid var(--vi); outline-offset: -2px; }

/* How the selected audiences are put together. Three buttons and a sentence —
   blended and overlapped are different questions, not a display preference. */
.rl-mode { margin-top: 4px; }
.seg { display: flex; gap: 3px; padding: 0 2px; }
.seg button {
  flex: 1 1 0;
  height: 27px;
  border: 1px solid var(--shell-line);
  border-radius: 8px;
  background: var(--card);
  color: var(--shell-ink3);
  font-size: 11.5px;
  cursor: pointer;
  transition: background .14s, color .14s, border-color .14s;
}
.seg button:hover { border-color: var(--shell-ink3); color: var(--shell-ink); }
.seg button.on {
  background: var(--shell-ink);
  border-color: var(--shell-ink);
  color: var(--shell-2);
  font-weight: 600;
}
.seg button:focus-visible { outline: 2px solid var(--vi); outline-offset: 1px; }
.seg-note {
  margin: 7px 3px 0;
  font-size: 10.8px;
  line-height: 1.45;
  color: var(--shell-ink3);
}
.seg-note b { color: var(--pill-amber); font-weight: 700; }

.aud-def {
  margin: 8px 3px 0;
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--shell-ink3);
}

/* The chip takes `margin-top: auto` so the pair sits at the foot of the rail;
   the counts below it then follow immediately rather than fighting for the
   same slot. */
.rl-meth {
  margin-top: auto;
  padding: 8px 11px;
  border: 1px solid var(--shell-line);
  border-radius: 999px;
  background: var(--sunken);
  color: var(--shell-ink2);
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  text-align: center;
  cursor: pointer;
}
.rl-meth:hover {
  background: var(--shell-ink);
  border-color: var(--shell-ink);
  color: var(--shell-2);
}

/* The one way off the rail. A row rather than a bare tile: the rail is a
   column of words, and a 22px square floating in it reads as decoration
   rather than as somewhere to go. Quiet at rest, and it never shows a
   selected state — there is nothing here to select. */
.rl-step {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  padding: 5px 6px;
  border-radius: 9px;
  text-decoration: none;
  color: var(--shell-ink2);
}
.rl-step:hover { background: var(--sunken); color: var(--shell-ink); }
.rl-step:focus-visible { outline: 2px solid var(--vi); outline-offset: 1px; }
/* The mark carries its own field, shadow and radius from the process map, so
   nothing here paints behind it. */
.rl-step-lg { width: 20px; height: 20px; flex: none; }
.rl-step-lg svg { width: 20px; height: 20px; border-radius: 6px; display: block; }
.rl-step-nm { flex: 1 1 auto; min-width: 0; font-size: 11.5px; letter-spacing: -.005em; }
.rl-step-n {
  flex: none;
  font-family: var(--mono);
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: .1em;
  color: var(--shell-ink3);
}

.rl-foot {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--shell-line);
  font-family: var(--mono);
  font-size: 9.5px;
  line-height: 1.6;
  letter-spacing: .04em;
  color: var(--shell-ink3);
}

/* ---------- main ---------- */
.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}
/* One row above the board: what is drawn, how much of it, and the two
   switches. Everything here acts on the board to its right. */
.hd {
  flex: none;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--shell-line);
  background: var(--shell-2);
}
/* Scrolled, never wrapped. Ten chips on a narrow window would wrap to a second
   row and push the board down every time one was toggled. */
.cats {
  flex: 1 1 auto;
  display: flex;
  gap: 5px;
  min-width: 0;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: thin;
}
.cats::-webkit-scrollbar { height: 5px; }
.cats::-webkit-scrollbar-thumb { background: var(--a12); border-radius: 3px; }
.cat {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 26px;
  padding: 0 10px;
  border: 1px solid var(--shell-line);
  border-radius: 999px;
  background: var(--card);
  font-size: 11px;
  color: var(--shell-ink2);
  cursor: pointer;
  white-space: nowrap;
  transition: border-color .14s, color .14s, opacity .14s;
}
.cat .sw { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--ci); }
.cat.off { opacity: .38; }
.cat:hover { border-color: var(--shell-ink3); color: var(--shell-ink); }
.cat:focus-visible { outline: 2px solid var(--vi); outline-offset: 1px; }

.hd-right { display: flex; gap: 6px; flex: none; }
.hd-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 26px;
  padding: 0 10px;
  border: 1px solid var(--pill-line, var(--shell-line));
  border-radius: 999px;
  background: var(--shell-2);
  font-family: var(--mono);
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--pill-ink, var(--shell-ink3));
  white-space: nowrap;
}
.hd-pill b { font-weight: 700; color: var(--shell-ink); letter-spacing: 0; font-size: 11px; }

.hd-tools { display: flex; align-items: center; gap: 6px; flex: none; }

/* ---------- the module bar ----------
   The bar wears the pill; the row inside it wears nothing.

   ⚠️ DRAWN ON `.modnav` IT WOULD BE A CAPSULE AROUND NOTHING. The row is the
   part that collapses to zero, so a border and a background on it leave an
   empty outline sitting in the header of a folded bar. */
.modbar {
  display: flex;
  align-items: center;
  gap: 9px;
  flex: none;
  height: 26px;
  padding: 0 5px;
  border: 1px solid var(--shell-line);
  border-radius: 999px;
  background: var(--shell-2);
}
.modnav { display: flex; align-items: center; gap: 6px; flex: none; }
.modhome { display: flex; flex: none; border-radius: 8px; }
.modhome svg { width: 20px; height: 20px; display: block; border-radius: 8px; }
.modhome:hover { filter: brightness(1.12); }
.modsep { width: 1px; height: 15px; background: var(--shell-line); flex: none; }

/* The icon is the tile — it brings its own field, shadow and colour from the
   process map, so nothing here paints a background. */
.modtile { flex: none; width: 20px; height: 20px; display: block; border-radius: 8px; text-decoration: none; }
.modtile svg { width: 100%; height: 100%; display: block; border-radius: 8px; }
.modtile:hover { filter: brightness(1.08); }
/* Which step you are standing in: ringed rather than recoloured, so the icon
   stays the icon. ⚠️ NO `cursor: default` here, unlike the tools that own their
   own page — Moments is stage 6.2 OF step 02, so the ring says where you are
   and the link still has somewhere to go. */
.modtile.on { box-shadow: 0 0 0 2px var(--vi); }
.modtile:focus-visible, .modhome:focus-visible { outline: 2px solid var(--vi); outline-offset: 2px; }

/* WHICH PLAN THIS IS. Outside the fold, so it stays on screen however folded
   everything beside it gets. Empty until there is a plan to name — and
   ⚠️ `[hidden]` needs saying out loud, because an author `display` beats the
   browser's own rule and `hidden` would otherwise do nothing at all. */
.pachip {
  flex: none;
  font-family: var(--mono);
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--shell-ink3);
  background: none;
  border: 1px solid var(--shell-line);
  border-radius: 999px;
  padding: 0 10px;
  height: 20px;
  cursor: pointer;
  white-space: nowrap;
}
.pachip[hidden] { display: none; }
.pachip:hover { color: var(--shell-ink); border-color: var(--shell-ink3); }

/* Kessel, as an icon rather than a row. */
.hdlaunch {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border: 1px solid var(--shell-line);
  border-radius: 999px;
  background: var(--card);
  font-size: 12px;
  line-height: 1;
  text-decoration: none;
}
.hdlaunch:hover { border-color: var(--shell-ink3); transform: translateY(-1px); }
.hdlaunch:focus-visible { outline: 2px solid var(--vi); outline-offset: 2px; }

/* The theme control travels in the strip now, so it is sized to the row it
   sits in rather than to the tool row it left. */
.hd-strip .tool { height: 22px; min-width: 22px; padding: 0 6px; }
.tool {
  height: 26px;
  min-width: 26px;
  padding: 0 10px;
  border: 1px solid var(--shell-line);
  border-radius: 999px;
  background: var(--card);
  color: var(--shell-ink3);
  font-size: 11px;
  cursor: pointer;
  transition: background .14s, color .14s, border-color .14s;
}
.tool:hover { border-color: var(--shell-ink3); color: var(--shell-ink); }
.tool.on { background: var(--shell-ink); border-color: var(--shell-ink); color: var(--shell-2); }
.tool:focus-visible { outline: 2px solid var(--vi); outline-offset: 1px; }

.body { flex: 1 1 auto; overflow: auto; padding: 16px 20px 60px; }

/* ---------- band vocabulary, shared by all five ---------- */
.bandpill {
  display: inline-flex;
  align-items: center;
  height: 19px;
  padding: 0 8px;
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  white-space: nowrap;
}
.bandpill.anchor { background: rgba(11, 122, 103, .14); color: var(--pill-green); }
.bandpill.play   { background: rgba(26, 103, 210, .14); color: var(--pill-blue); }
.bandpill.watch  { background: rgba(148, 98, 0, .14);   color: var(--pill-amber); }
.bandpill.skip   { background: var(--a08);              color: var(--shell-ink3); }

.legend {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  font-size: 11.5px;
  color: var(--shell-ink3);
}
.legend .li { display: inline-flex; align-items: center; gap: 6px; }
.legend .li b { font-weight: 620; color: var(--shell-ink); }
.legend .li i { font-style: normal; opacity: .8; }
.legend .li.dim { opacity: .55; }

/* The relevance ramp. Drawn in a neutral ink rather than one category's hue,
   so it reads as a scale and not as a thirteenth category. Same six steps the
   bars use, and the same mix against the card, so a swatch here is genuinely
   the shade a bar at that score will be. */
.legend .li.ramp { gap: 8px; }
.rmp { display: inline-flex; align-items: center; gap: 2px; }
.rmp i {
  width: 15px;
  height: 11px;
  border-radius: 3px;
  border: 1px solid var(--a12);
  /* Both knobs, exactly as a bar mixes them, so a swatch here really is the
     shade a bar at that score will be. */
  background: color-mix(in srgb,
                color-mix(in srgb, var(--shell-ink2) var(--f), var(--card)),
                #000 var(--dk, 0%));
}
.rmp-x { opacity: .8; }

/* The bar treatments, at legend size. Same three rules as the board so the two
   can never drift: solid, tinted, outline. */
.key {
  --kc: var(--shell-ink2);
  display: inline-block;
  width: 26px;
  height: 12px;
  border-radius: 4px;
  border: 1px solid transparent;
  background: var(--kc);
  flex: none;
}
.key.play  { background: color-mix(in srgb, var(--kc) 22%, var(--card)); border-color: color-mix(in srgb, var(--kc) 55%, transparent); }
.key.watch { background: transparent; border-color: color-mix(in srgb, var(--kc) 48%, transparent); }

/* ============================================================
   02 — THE RANKED BRIEF
   ============================================================ */
.parts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 9px 16px; padding-top: 10px; }
.part .pk {
  display: flex;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--shell-ink3);
}
.part .pk b { color: var(--shell-ink); font-size: 10.5px; letter-spacing: 0; }
.part .pb { height: 5px; border-radius: 3px; background: var(--a08); margin-top: 4px; overflow: hidden; }
.part .pb i { display: block; height: 100%; border-radius: 3px; background: var(--pc, var(--shell-ink3)); }
.part .pw { font-size: 10.5px; color: var(--shell-ink3); margin-top: 3px; line-height: 1.4; }

/* ============================================================
   03 — THE RIBBON
   ============================================================ */
/* WIDTH. A year across a laptop gives each month about 90px, which is a
   fortnight per centimetre — enough to see that something is in October, not
   enough to see what it sits beside, and that adjacency is the whole argument
   the ribbon makes. So a month gets a real column and the year gets wider than
   the screen; .body already scrolls, so left and right is how you read it.

   Driven off --mos, the month count app.js writes onto the element, rather
   than a hard-coded total — the window is twelve months today and the geometry
   should not quietly break if it is not tomorrow. */
.rib {
  --mo-w: 152px;
  --lb-w: 132px;
  position: relative;
  min-width: calc(var(--lb-w) + (var(--mos, 12) * var(--mo-w)));
}
/* The band the TODAY chip lives in. Reserved rather than shared: the chip is
   centred on the line and sits at the very top, so without a strip of its own
   it lands on top of the first family's header and covers the words there. */
.rib-lanes { position: relative; padding-top: 22px; }

/* A family of lanes. The header sits in the label column's own width so it
   lines up with the category names beneath it and never crosses the track —
   anything drawn across the track at full width reads as a moment spanning the
   year. Sticky left for the same reason the lane labels are: it has to survive
   the horizontal scroll. */
.fam { position: relative; }
.fam + .fam { margin-top: 14px; }
.fam-hd {
  position: sticky;
  left: 0;
  z-index: 3;
  display: flex;
  align-items: baseline;
  gap: 9px;
  width: max-content;
  max-width: 100%;
  padding: 7px 12px 6px 2px;
  background: var(--shell);
  /* It is a button now — collapsing the family — so the button's own chrome
     has to be undone before the layout above means anything. */
  border: 0;
  border-radius: 8px;
  text-align: left;
  cursor: pointer;
  font: inherit;
  color: inherit;
}
.fam-hd:hover { background: var(--a04); }
.fam-hd:focus-visible { outline: 2px solid var(--vi); outline-offset: 1px; }
.fam-caret {
  font-size: 9px;
  line-height: 1;
  color: var(--shell-ink3);
  transition: transform .16s;
  display: inline-block;
}
.fam.shut .fam-caret { transform: rotate(-90deg); }
/* A shut family keeps its rule, so the stack still reads as a stack. */
.fam.shut > .fam-hd { padding-bottom: 7px; }
.fam-bd[hidden] { display: none; }
.fam-nm {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--shell-ink);
}
.fam-n {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: .06em;
  color: var(--shell-ink3);
  white-space: nowrap;
}
/* The one line saying why these categories are together. Hidden on a narrow
   viewport, where the header would wrap into the lanes. */
.fam-note { font-size: 11px; color: var(--shell-ink3); opacity: .85; }
@media (max-width: 1180px) { .fam-note { display: none; } }

/* A hairline the width of the whole family, under the header, so the grouping
   is visible on the board and not only in the words. Drawn on the family
   rather than between lanes: the lanes already have their own dividers, and a
   second one at the same weight would make every row look like a group. */
.fam > .fam-hd::after {
  content: '';
  position: absolute;
  left: 2px;
  right: 0;
  bottom: 0;
  border-bottom: 2px solid var(--a16);
}
/* The lane immediately under a family header does not need its own top rule. */
.fam .rib-lane:first-of-type { border-top: none; }

/* TODAY. One line down the whole stack of lanes, sitting inside the track and
   offset by the label column, so it lands on the same x as a bar starting
   today. Red is reserved for it — no category owns red, and the congestion
   chart's red is a fill rather than a rule, so the line never reads as data.

   Percentage times a unitless fraction: the track is (100% - the label
   column), and --f is how far through the year today is. */
.today {
  position: absolute;
  top: 0;
  bottom: 0;
  left: calc(var(--lb-w) + (100% - var(--lb-w)) * var(--f, 0));
  width: 0;
  border-left: 2px solid #D93025;
  pointer-events: none;
  z-index: 4;
}
.today span {
  position: absolute;
  top: 0;
  left: 0;
  transform: translateX(-50%);
  padding: 1px 6px;
  border-radius: 0 0 6px 6px;
  background: #D93025;
  color: #fff;
  font-family: var(--mono);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  white-space: nowrap;
}
.rib-ax {
  position: sticky;
  top: 0;
  z-index: 5;
  display: grid;
  grid-template-columns: var(--lb-w, 132px) minmax(0, 1fr);
  background: var(--shell);
  padding-bottom: 8px;
}
/* The axis's own label cell. Sticky left like the lane labels, and above them,
   so the corner stays covered where the two sticky edges meet. */
.rib-axlb {
  position: sticky;
  left: 0;
  z-index: 6;
  background: var(--shell);
}
.rib-ax .mos { display: grid; }
.rib-ax .mo {
  border-left: 1px solid var(--shell-line);
  padding: 4px 0 4px 7px;
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--shell-ink3);
}
.rib-ax .mo:first-child { border-left: none; }
.rib-lane { display: grid; grid-template-columns: var(--lb-w, 132px) minmax(0, 1fr); align-items: stretch; }
.rib-lane + .rib-lane { border-top: 1px solid var(--shell-line); }
/* A lane is as tall as the moments in it, which for Tours & Concerts is
   eighteen rows. The label rides the top of its own lane rather than sitting
   centred in a 400px column of nothing, and sticks under the month axis while
   the lane scrolls past. */
/* Now that the year is wider than the viewport, the category name has to stay
   put while it scrolls — a lane whose label has slid off the left edge is an
   anonymous row of bars. Sticky in both axes: left against the horizontal
   scroll, and (below) top under the month axis. Opaque, or the bars run
   underneath it. */
.rib-lb {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  padding: 9px 10px 8px 2px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--shell-ink2);
  /* Sticky in both axes: top so it rides under the month header down a tall
     lane, left so it survives the horizontal scroll the wide year needs.
     Opaque, or bars scroll through underneath it. */
  position: sticky;
  top: 34px;
  left: 0;
  align-self: start;
  background: var(--shell);
  z-index: 3;
}
.rib-lb .sw { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--ci); margin-top: 4px; }
.rib-lb .t { min-width: 0; line-height: 1.25; }
/* How much lane the category is using. With no cap on rows this is the number
   that explains why one lane is eighteen rows and its neighbour is one. */
.rib-lb .n {
  display: block;
  margin-top: 2px;
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 400;
  letter-spacing: .05em;
  color: var(--shell-ink3);
}
.rib-tr { position: relative; padding: 6px 0; }
/* The month gridlines, drawn behind the bars rather than as elements between
   them, so a bar can cross a boundary — which is the whole reason a ribbon
   beats a grid for this data. */
.rib-grid { position: absolute; inset: 0; display: grid; pointer-events: none; }
.rib-grid span { border-left: 1px solid var(--shell-line); }
.rib-grid span:first-child { border-left: none; }
.rib-sub { position: relative; height: 20px; }
.bar {
  position: absolute;
  top: 2px;
  height: 16px;
  border-radius: 5px;
  border: 1px solid transparent;
  padding: 0 6px;
  font-size: 10px;
  line-height: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  /* HUE = category, INK = relevance, in two moves. --f is how much of the hue
     survives against the card, which gives the pale half of the ramp. --dk
     then takes the top steps PAST the hue toward black, because a category hue
     at full strength is only a mid-tone and a board of mid-tones has no top
     end — the most relevant moments have to be able to pop.

     The RAW hue is used here, not the theme-lifted --ci. The lift exists so a
     hairline or an 8px dot survives on near-black; a filled bar is neither,
     and lifting it is what left dark-mode bars as pastels. Borders below still
     take --ci, which is the thin use it was made for. */
  background: color-mix(in srgb,
                color-mix(in srgb, var(--c) var(--f, 100%), var(--card)),
                #000 var(--dk, 0%));
  color: var(--shell-ink);
}
/* White type, on the two steps dense enough to carry it. Checked rather than
   assumed: at full hue the category colours run 5.2–5.8:1 against white, and
   the top step is darkened well past that. The step below — 74% of the hue
   against the card — drops to about 3.6:1 against white while reaching 5.0:1
   against the ink, so white would be the WORSE choice there despite looking
   like the bolder one. That is where the line sits.

   One rule for both themes, because the fill is built from the raw hue rather
   than the lifted one: a full-strength category hue is the same colour in
   light and dark, so the type that works on it is too. */
.bar.lit { color: #FFFFFF; }
/* The band no longer sets the fill — the shade does, from the score. What the
   band still sets is the outline, because crossing 72 or 56 changes what a
   planner DOES and that deserves an edge rather than another few percent of
   ink. Anchor gets a full-strength border, Play a softer one, Watch only an
   outline with almost nothing inside it. */
.bar.anchor { border-color: color-mix(in srgb, var(--ci) 72%, transparent); }
.bar.play   { border-color: color-mix(in srgb, var(--ci) 55%, transparent); }
.bar.watch  { border-color: color-mix(in srgb, var(--ci) 48%, transparent); }
/* There is no `.bar.skip`. Nothing under 40 is ever drawn on the ribbon, and
   Skip is by definition under 40, so the rule only ever looked like it did
   something. The Skip count lives in the header instead. */
.bar:hover { outline: 2px solid var(--shell-ink); outline-offset: 1px; z-index: 3; }
/* A single-day moment has no width to give a label, so it is a tick and the
   name is in the tooltip. Drawing it as a 1px bar with text clipped to nothing
   was worse: it looked like a rendering fault. */
.bar.tick { padding: 0; min-width: 5px; border-radius: 3px; }

.rib-cong { margin-top: 18px; }
.cong-wrap { display: grid; grid-template-columns: var(--lb-w, 132px) minmax(0, 1fr); align-items: end; }
.cong-bars { display: flex; align-items: flex-end; gap: 1px; height: 62px; }
.cong-bars i { flex: 1 1 0; border-radius: 2px 2px 0 0; background: var(--cb, var(--a16)); min-height: 2px; }

/* ---------- the moment detail popover ---------- */
.pop {
  position: fixed;
  z-index: 80;
  width: 320px;
  border-radius: 13px;
  border: 1px solid var(--shell-line);
  background: var(--card);
  box-shadow: 0 22px 60px var(--a22);
  padding: 13px 15px 14px;
}
.pop .t { font-size: 14px; font-weight: 650; letter-spacing: -.015em; line-height: 1.25; }
.pop .meta { font-family: var(--mono); font-size: 10px; color: var(--shell-ink3); margin-top: 5px; line-height: 1.6; }
.pop .meta .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; background: var(--ci); }
.pop .row { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
.pop .sc { font-size: 22px; font-weight: 680; letter-spacing: -.03em; }
.pop .parts { grid-template-columns: 1fr 1fr; gap: 8px 14px; padding-top: 10px; margin-top: 9px; border-top: 1px dashed var(--shell-line); }
.pop .note { margin-top: 9px; font-size: 11px; line-height: 1.5; color: var(--shell-ink3); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ============================================================
   THE RAIL'S AUDIENCE LIST, AND ADDING TO IT
   ============================================================ */
.aud-row { display: flex; align-items: stretch; gap: 2px; }
.aud-row + .aud-row { margin-top: 2px; }
.aud-row .aud { flex: 1 1 auto; min-width: 0; }

/* "Yours" rather than a coloured dot. The distinction that matters is not
   decorative — the six that ship are invented placeholders and the ones the
   user added are real, so the label says which is which in words. */
.aud .mine {
  display: inline-block;
  margin-left: 6px;
  padding: 0 5px;
  border-radius: 999px;
  background: rgba(11, 122, 103, .16);
  color: var(--pill-green);
  font-family: var(--mono);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  vertical-align: 1px;
}

/* ESTIMATED. Same badge shape as "Yours", deliberately — they answer different
   questions and can appear together — but amber rather than green, because
   this one is a caveat and that one is only ownership. It marks an audience
   whose indices were reasoned out rather than read off a cut, and it has to
   survive anywhere the audience is shown; a number that cannot be traced must
   never look like one that can. */
.aud .est {
  display: inline-block;
  margin-left: 5px;
  padding: 0 5px;
  border-radius: 999px;
  background: rgba(148, 98, 0, .16);
  color: #7A5100;
  font-family: var(--mono);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  vertical-align: 1px;
}
[data-theme="dark"] .aud .est { color: #D9A22B; background: rgba(217, 162, 43, .17); }

/* NO CUT. An official target whose numbers have not landed. Neutral rather
   than alarming — nothing is wrong, the cut is simply not here yet — but
   unmissable, because an audience with no affinity scores every moment exactly
   as every other audience with no affinity does. */
.aud .pend {
  display: inline-block;
  margin-left: 5px;
  padding: 0 5px;
  border-radius: 999px;
  border: 1px solid var(--shell-line);
  color: var(--shell-ink3);
  font-family: var(--mono);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  vertical-align: 1px;
}

/* The same fact, said on the board, for when one is actually selected. */
.nocut {
  margin: 0 0 12px;
  padding: 9px 12px;
  border: 1px solid var(--pill-amber-line);
  border-left: 3px solid var(--pill-amber);
  border-radius: 9px;
  background: color-mix(in srgb, var(--pill-amber) 7%, transparent);
  color: var(--shell-ink2);
  font-size: 12.3px;
  line-height: 1.45;
}
.nocut b { color: var(--shell-ink); }

/* A group with nothing in it still draws its heading, so this is what sits
   under it. Muted, in the rail's own voice, and never mistaken for a row. */
.aud-none {
  margin: 2px 3px 4px;
  color: var(--shell-ink3);
  font-size: 11.5px;
  line-height: 1.45;
  opacity: .8;
}
/* The first group heading sits directly under the brand, where `.gap`'s 20px
   is too much air. Every later one keeps it. */
.aud-grp:first-child .rl-hd.gap { margin-top: 6px; }

/* Only ever drawn beside an audience the user owns, so it can never be the
   control that deletes something they cannot get back. */
.aud-x {
  flex: none;
  width: 22px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: none;
  color: var(--shell-ink3);
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
  opacity: 0;
  transition: opacity .14s, background .14s, color .14s;
}
.aud-row:hover .aud-x, .aud-x:focus-visible { opacity: 1; }
.aud-x:hover { background: rgba(165, 14, 14, .1); color: #A50E0E; }
.aud-x:focus-visible { outline: 2px solid var(--vi); outline-offset: -2px; }

/* The i. Same column treatment as the remove button — quiet until the row is
   hovered, so a rail of eight audiences is not a rail of eight icons, but
   always reachable by keyboard. */
.aud-i {
  flex: none;
  align-self: flex-start;
  width: 18px;
  height: 18px;
  margin-top: 8px;
  border: 1px solid var(--shell-line);
  border-radius: 50%;
  background: none;
  color: var(--shell-ink3);
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  opacity: 0;
  transition: opacity .14s, color .14s, border-color .14s;
}
.aud-row:hover .aud-i, .aud-i:focus-visible { opacity: 1; }
.aud-i:hover { color: var(--shell-ink); border-color: var(--shell-ink3); }
.aud-i:focus-visible { outline: 2px solid var(--vi); outline-offset: 1px; }

/* ---------- what an audience is built from ---------- */
.aud-pop { width: 360px; max-height: 74vh; overflow: auto; }
.aud-pop .prov { margin: 8px 0 2px; font-size: 11.5px; color: var(--shell-ink3); line-height: 1.45; }
.aud-pop .pv { font-weight: 700; color: var(--shell-ink2); }
.aud-pop .pv.warn { color: var(--pill-amber); }
.aud-pop .note.quiet { color: var(--shell-ink3); font-size: 11.5px; }

.aff-hd {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin: 12px 0 6px;
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--shell-ink3);
}
.aff-hd span { font-weight: 400; letter-spacing: .04em; text-transform: none; opacity: .8; }

.aff-r {
  display: grid;
  grid-template-columns: 118px 1fr 30px;
  align-items: center;
  gap: 7px;
  padding: 2px 0;
  font-size: 11.5px;
}
.ac { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--shell-ink2); }
.ac .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--ci); }
.av { text-align: right; font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; }
/* The reason the index is what it is, when there is one. Spans the full row
   under it — a justification squeezed into a column is a justification nobody
   reads. */
.aw {
  grid-column: 1 / -1;
  margin: 0 0 3px 20px;
  font-size: 10.5px;
  line-height: 1.35;
  color: var(--shell-ink3);
}
/* A category the cut never mentioned. Distinct from one that genuinely came
   back at par, which is the whole reason this panel lists everything. */
.aff-r.unset { opacity: .55; }
.aff-r.unset .av { font-style: italic; }

/* Drawn against par rather than against the biggest number on screen, so 100
   lands in the same place on every audience and two can be compared by eye. */
.ab {
  position: relative;
  height: 5px;
  border-radius: 3px;
  background: var(--a08);
  overflow: hidden;
}
.ab::after {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  width: var(--w, 0);
  background: var(--k, var(--pill-blue));
  border-radius: 3px;
}
/* Par, at 100 of the 250 the bar spans. */
.ab::before {
  content: '';
  position: absolute;
  left: 40%;
  top: -2px;
  bottom: -2px;
  width: 1px;
  background: var(--a22);
  z-index: 2;
}
.ab.none { background: repeating-linear-gradient(90deg, var(--a08) 0 3px, transparent 3px 6px); }

.ents { display: flex; flex-wrap: wrap; gap: 5px; }
.ent {
  padding: 2px 7px;
  border: 1px solid var(--shell-line);
  border-radius: 999px;
  font-size: 11px;
  color: var(--shell-ink2);
}
.ent b { font-weight: 600; }

.aud-add {
  width: 100%;
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 7px;
  height: 32px;
  padding: 0 11px;
  border: 1px dashed var(--shell-line);
  border-radius: 10px;
  background: none;
  color: var(--shell-ink3);
  font-size: 12.3px;
  cursor: pointer;
  transition: border-color .14s, color .14s, background .14s;
}
.aud-add span { font-size: 14px; line-height: 1; }
.aud-add:hover { border-color: var(--shell-ink3); color: var(--shell-ink); background: var(--a04); }
.aud-add:focus-visible { outline: 2px solid var(--vi); outline-offset: 1px; }

/* ============================================================
   THE PANEL
   ============================================================ */
.panel-host { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px; }
/* Author display beats the UA's [hidden] rule, so the attribute alone would do
   nothing here and the panel would sit open over the board forever. */
.panel-host[hidden] { display: none; }
.pn-scrim { position: absolute; inset: 0; background: var(--scrim); }
.pn-card {
  position: relative;
  width: 100%;
  max-width: 940px;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  background: var(--card);
  border: 1px solid var(--shell-line);
  border-radius: 18px;
  box-shadow: 0 22px 60px var(--a22);
  overflow: hidden;
}
.pn-hd {
  flex: none;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  padding: 20px 22px 16px;
  border-bottom: 1px solid var(--shell-line);
}
.pn-kick {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--shell-ink3);
}
.pn-hd h2 { margin: 5px 0 0; font-size: 19px; font-weight: 680; letter-spacing: -.025em; }
.pn-x {
  flex: none;
  width: 30px; height: 30px;
  border: 1px solid var(--shell-line);
  border-radius: 9px;
  background: none;
  color: var(--shell-ink3);
  font-size: 17px;
  line-height: 1;
  cursor: pointer;
}
.pn-x:hover { background: var(--shell-ink); border-color: var(--shell-ink); color: var(--shell-2); }

.pn-bd {
  flex: 1 1 auto;
  overflow-y: auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 26px;
  padding: 20px 22px 22px;
}
@media (max-width: 860px) { .pn-bd { grid-template-columns: minmax(0, 1fr); } }
.pn-col { display: flex; flex-direction: column; gap: 15px; min-width: 0; }

.fld { display: block; min-width: 0; }
.fld > span {
  display: block;
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--shell-ink3);
  margin-bottom: 6px;
}
.fld > span i { font-style: normal; opacity: .7; letter-spacing: .1em; }
.fld input[type="text"], .fld textarea, #pnText {
  width: 100%;
  padding: 9px 11px;
  border: 1px solid var(--shell-line);
  border-radius: 10px;
  background: var(--sunken);
  color: var(--shell-ink);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.5;
  resize: vertical;
}
#pnText { font-family: var(--mono); font-size: 11.5px; margin-top: 8px; }
.fld input:focus-visible, .fld textarea:focus-visible, #pnText:focus-visible {
  outline: 2px solid var(--vi); outline-offset: 1px;
}
.hint { margin: 7px 0 0; font-size: 11px; line-height: 1.5; color: var(--shell-ink3); }

.drop {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 18px 14px;
  border: 1.5px dashed var(--shell-line);
  border-radius: 12px;
  background: var(--sunken);
  text-align: center;
  transition: border-color .14s, background .14s;
}
.drop.over { border-color: var(--pill-blue); background: var(--eg); }
.drop b { font-size: 12.5px; font-weight: 620; }
.drop span { font-size: 11.5px; color: var(--shell-ink3); }
.drop button {
  margin-top: 7px;
  height: 28px;
  padding: 0 13px;
  border: 1px solid var(--shell-line);
  border-radius: 999px;
  background: var(--card);
  font-size: 12px;
  color: var(--shell-ink2);
  cursor: pointer;
}
.drop button:hover { border-color: var(--shell-ink3); color: var(--shell-ink); }

/* What the parser did. Counts and every unusable line, listed — the failure
   this panel exists to prevent is a wrong number arriving unnoticed. */
.rd {
  border: 1px solid var(--eg-line);
  background: var(--eg);
  border-radius: 12px;
  padding: 11px 13px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.rd.empty {
  border-style: dashed;
  border-color: var(--shell-line);
  background: transparent;
  color: var(--shell-ink3);
  font-size: 11.5px;
  text-align: center;
  padding: 16px 13px;
}
.rd-row { font-size: 11.5px; line-height: 1.5; color: var(--shell-ink2); }
.rd-row b { font-weight: 700; color: var(--shell-ink); }
.rd-row i { font-style: normal; color: var(--shell-ink3); }
.rd-row.warn { color: var(--pill-amber); }
.rd-row.warn b { color: var(--pill-amber); }
.rd-row.bad { color: #A50E0E; }
.rd-row.bad b { color: #A50E0E; }

.grid { display: flex; flex-direction: column; gap: 3px; }
.gr {
  display: grid;
  grid-template-columns: 10px minmax(0, 1fr) 62px 42px;
  align-items: center;
  gap: 8px;
  padding: 3px 4px;
  border-radius: 7px;
}
.gr:hover { background: var(--a04); }
.gr .sw { width: 8px; height: 8px; border-radius: 50%; background: var(--ci); }
.gr .gn { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gr input {
  width: 100%;
  height: 26px;
  padding: 0 7px;
  border: 1px solid var(--shell-line);
  border-radius: 7px;
  background: var(--sunken);
  color: var(--shell-ink);
  font-family: var(--mono);
  font-size: 11.5px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.gr input:focus-visible { outline: 2px solid var(--vi); outline-offset: 1px; }
.gr .gt {
  font-family: var(--mono);
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--pill-green);
}
.gr.par .gt { color: var(--shell-ink3); }
.gr.par input { opacity: .6; }

.ents { display: flex; flex-direction: column; gap: 2px; }
.ent {
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  padding: 4px 5px;
  border-radius: 7px;
  font-size: 12px;
  cursor: pointer;
}
.ent:hover { background: var(--a04); }
.ent input { accent-color: var(--pill-blue); }
.ent span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ent b { font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; }

.pn-ft {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  flex-wrap: wrap;
  padding: 14px 22px;
  border-top: 1px solid var(--shell-line);
  background: var(--sunken);
}
.pn-note { margin: 0; font-size: 11.5px; color: var(--shell-ink3); }
.pn-note.warn { color: var(--pill-amber); }
.pn-acts { display: flex; gap: 8px; }
.btn {
  height: 34px;
  padding: 0 15px;
  border: 1px solid var(--shell-line);
  border-radius: 999px;
  background: var(--card);
  color: var(--shell-ink2);
  font-size: 12.5px;
  font-weight: 560;
  cursor: pointer;
}
.btn:hover { border-color: var(--shell-ink3); color: var(--shell-ink); }
.btn.pri { background: var(--shell-ink); border-color: var(--shell-ink); color: var(--shell-2); font-weight: 620; }
.btn.pri:hover { opacity: .88; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:disabled:hover { border-color: var(--shell-line); opacity: .45; }
.btn:focus-visible { outline: 2px solid var(--vi); outline-offset: 2px; }

/* ============================================================
   THE GEMINI LAYER
   Deliberately quiet. It is a second way in, not the headline — the typed and
   pasted paths are the ones that need no trust, and the design should not
   suggest otherwise. One accent, violet, and only on the control itself.
   ============================================================ */
.gem-row { display: flex; align-items: flex-start; gap: 10px; margin-top: 10px; }
.gem {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 13px;
  border: 1px solid var(--vi);
  border-radius: 999px;
  background: color-mix(in srgb, var(--vi) 10%, transparent);
  color: var(--vi-ink);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: background .14s, color .14s;
}
.gem::before { content: "✦"; font-size: 11px; }
.gem:hover:not(:disabled) { background: var(--vi); color: #fff; }
.gem:disabled { opacity: .55; cursor: default; }
.gem:focus-visible { outline: 2px solid var(--vi); outline-offset: 2px; }
.gem.sm { height: 26px; padding: 0 11px; font-size: 11.5px; }
.gem-note { font-size: 10.5px; line-height: 1.45; color: var(--shell-ink3); }

/* The extraction result, told apart from the literal parse. Violet edge, so a
   reader can see at a glance which numbers came from where. */
.rd.gem { border-color: color-mix(in srgb, var(--vi) 40%, transparent); background: color-mix(in srgb, var(--vi) 7%, transparent); }
.rd.gem + .rd { margin-top: 8px; }

/* An estimated profile, before it is saved. Amber rather than the Gemini
   violet used above it, because these two blocks say opposite things: that one
   reports numbers CONFIRMED against a source, this one reports numbers nobody
   measured. They must not look like the same reassurance. */
.rd.est {
  border-color: var(--pill-amber-line);
  background: color-mix(in srgb, var(--pill-amber) 8%, transparent);
}
.rd.est + .rd, .rd.est + .rd.gem { margin-top: 8px; }

/* The line the number was read from, under the number it produced. This is the
   whole safeguard made visible: a figure that landed on the wrong category is
   obvious here and invisible without it. */
.gr.q { grid-template-areas: "sw name input tag" "q q q q"; row-gap: 2px; padding-bottom: 5px; }
.gr.q .sw { grid-area: sw; }
.gr.q .gn { grid-area: name; }
.gr.q input { grid-area: input; }
.gr.q .gt { grid-area: tag; }
.gq {
  grid-area: q;
  padding-left: 18px;
  font-size: 10px;
  line-height: 1.4;
  color: var(--vi-ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.gr .gt { color: var(--pill-green); }
.gr.q .gt { color: var(--vi-ink); }

.clr {
  margin-top: 8px;
  border: none;
  background: none;
  padding: 2px 0;
  font-size: 11px;
  color: var(--shell-ink3);
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
}
.clr:hover { color: #A50E0E; }

/* The read, in the popover. */
.pop-read { margin-top: 11px; padding-top: 10px; border-top: 1px dashed var(--shell-line); }
.rdtxt { margin: 0 0 8px; font-size: 12px; line-height: 1.55; color: var(--shell-ink2); }
.rdtxt.bad { color: #A50E0E; }
.copy {
  height: 24px;
  padding: 0 10px;
  border: 1px solid var(--shell-line);
  border-radius: 999px;
  background: var(--card);
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--shell-ink3);
  cursor: pointer;
}
.copy:hover { border-color: var(--shell-ink3); color: var(--shell-ink); }

/* Where a combined affinity came from. */
.affby {
  margin: 10px 0 2px;
  padding: 9px 11px;
  border-radius: 10px;
  background: var(--sunken);
  border: 1px solid var(--shell-line);
}
.affby-k {
  font-family: var(--mono);
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--shell-ink3);
  margin-bottom: 6px;
}
.affby-r {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 62px 26px;
  align-items: center;
  gap: 8px;
  font-size: 11px;
}
.affby-r + .affby-r { margin-top: 3px; }
.affby-r .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--shell-ink2); }
.affby-r .b { height: 5px; border-radius: 3px; background: var(--a08); overflow: hidden; }
.affby-r .b i { display: block; height: 100%; border-radius: 3px; background: var(--pill-blue); }
.affby-r .v {
  font-family: var(--mono);
  font-size: 10.5px;
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--shell-ink);
}

/* ============================================================
   THE GEMINI RAIL
   ============================================================ */
.app { grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--chat-w, 330px); }
.app:has(.chat.shut) { --chat-w: 42px; }

.chat {
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--shell-2);
  border-left: 1px solid var(--shell-line);
  overflow: hidden;
}
.ck-hd {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 12px 11px;
  border-bottom: 1px solid var(--shell-line);
}
.ck-mark { color: var(--vi); font-size: 13px; flex: none; }
.ck-n { font-size: 13px; font-weight: 620; flex: 1 1 auto; }
.ck-clear, .ck-fold {
  flex: none;
  height: 24px;
  padding: 0 9px;
  border: 1px solid var(--shell-line);
  border-radius: 999px;
  background: none;
  color: var(--shell-ink3);
  font-size: 11px;
  cursor: pointer;
}
.ck-fold { padding: 0; width: 24px; font-size: 13px; line-height: 1; }
.ck-clear:hover, .ck-fold:hover { border-color: var(--shell-ink3); color: var(--shell-ink); }
.ck-clear:focus-visible, .ck-fold:focus-visible { outline: 2px solid var(--vi); outline-offset: 1px; }

/* Collapsed, the rail keeps only the control that brings it back. Everything
   else goes rather than being squeezed — a panel with its conversation clipped
   in half is worse than one that is honestly not there. */
.chat.shut .ck-n, .chat.shut .ck-mark, .chat.shut .ck-clear,
.chat.shut .ck-body, .chat.shut .ck-ask { display: none; }
.chat.shut .ck-hd { padding: 12px 8px; border-bottom: none; }

.ck-body { flex: 1 1 auto; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.ck-empty { color: var(--shell-ink3); font-size: 11.5px; line-height: 1.55; }
.ck-empty p { margin: 0 0 9px; }
.ck-cav { padding-top: 9px; border-top: 1px dashed var(--shell-line); }

.ck-who {
  font-family: var(--mono);
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--shell-ink3);
  margin-bottom: 4px;
}
.ck-tx { font-size: 12.3px; line-height: 1.55; color: var(--shell-ink2); }
.ck-tx.muted { color: var(--shell-ink3); font-style: italic; }
.ck.user .ck-tx {
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--well);
  color: var(--shell-ink);
}
.ck.gemini .ck-who { color: var(--vi-ink); }
/* Figures the board did not supply, named rather than hidden. Refusing the
   whole answer over one stray digit would make the panel unusable; leaving it
   unmarked would make it untrustworthy. */
.ck-warn {
  margin-top: 7px;
  padding: 6px 9px;
  border-radius: 8px;
  background: rgba(148, 98, 0, .12);
  color: var(--pill-amber);
  font-size: 10.5px;
  line-height: 1.45;
}

.ck-ask {
  flex: none;
  display: flex;
  align-items: flex-end;
  gap: 7px;
  padding: 10px 12px 12px;
  border-top: 1px solid var(--shell-line);
}
.ck-ask textarea {
  flex: 1 1 auto;
  min-width: 0;
  resize: none;
  max-height: 130px;
  padding: 8px 10px;
  border: 1px solid var(--shell-line);
  border-radius: 10px;
  background: var(--sunken);
  color: var(--shell-ink);
  font-family: var(--sans);
  font-size: 12.3px;
  line-height: 1.45;
}
.ck-ask textarea:focus-visible { outline: 2px solid var(--vi); outline-offset: 1px; }
.ck-ask button {
  flex: none;
  width: 32px;
  height: 32px;
  border: none;
  border-radius: 9px;
  background: var(--shell-ink);
  color: var(--shell-2);
  font-size: 11px;
  cursor: pointer;
}
.ck-ask button:hover { opacity: .88; }
.ck-ask button:focus-visible { outline: 2px solid var(--vi); outline-offset: 2px; }

@media (max-width: 1180px) { .app { --chat-w: 42px; } .chat:not(.shut) .ck-body, .chat:not(.shut) .ck-ask { display: none; } }

/* Provenance for a component that has some. Quiet, because it appears under a
   number rather than instead of one — but present, because a scale figure a
   planner can trace is worth more than one they have to take on faith. */
.pop .src {
  margin-top: 8px;
  padding: 7px 9px;
  border-radius: 8px;
  background: var(--sunken);
  border: 1px solid var(--shell-line);
  font-size: 11px;
  line-height: 1.45;
  color: var(--shell-ink2);
}
.pop .src b { color: var(--shell-ink); }
.pop .src span { display: block; margin-top: 2px; color: var(--shell-ink3); font-size: 10px; }

/* The source credit on a family header. */
.fam-src {
  font-family: var(--mono);
  font-size: 8.5px;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--shell-ink3);
  padding: 1px 6px;
  border: 1px solid var(--shell-line);
  border-radius: 999px;
  white-space: nowrap;
}


/* ---------- the methodology overlay ---------- */
/* Same shape as the audience panel, its own prefix. Author display beats the
   UA's [hidden] rule, so the attribute alone would leave it open forever. */
.meth-host { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px; }
.meth-host[hidden] { display: none; }
.meth-scrim { position: absolute; inset: 0; background: var(--scrim); }
.meth-card {
  position: relative;
  width: 100%;
  max-width: 760px;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  background: var(--card);
  border: 1px solid var(--shell-line);
  border-radius: 18px;
  box-shadow: 0 22px 60px var(--a22);
  overflow: hidden;
}
.meth-hd {
  flex: none;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--shell-line);
}
.meth-kick {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--shell-ink3);
}
.meth-hd h2 { margin: 5px 0 0; font-size: 19px; font-weight: 680; letter-spacing: -.025em; }
.meth-x {
  flex: none;
  width: 30px; height: 30px;
  border: 1px solid var(--shell-line);
  border-radius: 9px;
  background: none;
  color: var(--shell-ink3);
  font-size: 17px;
  line-height: 1;
  cursor: pointer;
}
.meth-x:hover { background: var(--shell-ink); border-color: var(--shell-ink); color: var(--shell-2); }

.meth-bd {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 20px 24px 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.meth-lede { margin: 0; font-size: 13px; line-height: 1.6; color: var(--shell-ink2); }
.meth-lede b { color: var(--shell-ink); font-weight: 650; }

.meth-eq {
  font-family: var(--mono);
  font-size: 11.5px;
  line-height: 1.85;
  color: var(--shell-ink);
  background: var(--sunken);
  border: 1px solid var(--shell-line);
  border-radius: 10px;
  padding: 14px 16px;
  overflow-x: auto;
  white-space: pre;
}
.meth-eq b { color: var(--pill-blue); font-weight: 700; }

.meth-h {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--shell-ink3);
}

/* One row per component: what it asks, what it weighs, where the number is
   from. The weight column is mono so the four line up as a column of numbers
   rather than as prose. */
.meth-rows { display: flex; flex-direction: column; }
.meth-r {
  display: grid;
  grid-template-columns: 118px 1fr 52px;
  gap: 14px;
  align-items: baseline;
  padding: 11px 0;
  border-top: 1px solid var(--shell-line);
}
.meth-r:last-child { border-bottom: 1px solid var(--shell-line); }
.meth-rn { font-size: 12.5px; font-weight: 650; color: var(--shell-ink); }
.meth-rq { font-size: 12px; line-height: 1.5; color: var(--shell-ink2); }
.meth-rq i { color: var(--shell-ink3); font-style: normal; display: block; margin-top: 2px; font-size: 11.5px; }
.meth-rw {
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 600;
  color: var(--pill-blue);
  text-align: right;
}

.meth-bands { display: flex; flex-wrap: wrap; gap: 8px; }
.meth-band {
  display: flex;
  align-items: baseline;
  gap: 7px;
  padding: 7px 11px;
  border: 1px solid var(--shell-line);
  border-radius: 999px;
  font-size: 11.5px;
  color: var(--shell-ink2);
}
.meth-band b { color: var(--c); font-weight: 700; }
.meth-band span { font-family: var(--mono); font-size: 10px; color: var(--shell-ink3); }

/* The two notes that keep the panel honest: what is still a placeholder, and
   what the model becomes when the real cuts land. Amber and green carry the
   same meanings here as everywhere else in the tool. */
.meth-note {
  border-left: 3px solid var(--pill-amber);
  background: var(--sunken);
  border-radius: 0 8px 8px 0;
  padding: 13px 15px;
  font-size: 12px;
  line-height: 1.55;
  color: var(--shell-ink2);
}
.meth-note.next { border-left-color: var(--pill-green); }
.meth-note b { color: var(--shell-ink); font-weight: 650; }
.meth-note .meth-h { margin-bottom: 5px; }
.meth-note.next .meth-h { color: var(--pill-green); }
.meth-note p { margin: 0 0 6px; }
.meth-note p:last-child { margin-bottom: 0; }

/* A sliding strip of chrome, and the button that folds it away.
   Shared across the planning modules — this file is copied between them the
   way `_gate.js` is, and it styles the fold rather than anything travelling in
   it. Each module supplies its own contents and its own colour variables.

   ⚠️ NO WIDTH IS DECLARED HERE ON PURPOSE. It animated between a fixed ceiling
   and zero, and a ceiling chosen to be safely larger than the strip meant the
   first stretch of every collapse clipped nothing — the motion was not linear
   in the thing being watched, which is what "not smooth" looks like. The real
   width is measured in `js/strip.js` and written inline; only script knows how
   wide this is on this screen.

   `max-width` is still the property, because it is the one that animates from
   content-sized to nothing without the contents reflowing on the way: the
   icons slide out at their own size rather than squashing toward it.

   ⚠️ FOUR VARIABLES, AND THEY ARE THE WHOLE REASON THIS FILE COPIES CLEANLY.
   Each module names its colours differently — `--shell-line` here, `--line2`
   next door — so a file written against either one arrives broken and has to
   be edited on the way in, which is how two copies of a shared file stop being
   the same file. This declares what it needs and each module maps them in its
   own stylesheet. Nothing else in here knows a module's palette. */
.hd-strip {
  display: flex;
  align-items: center;
  gap: 9px;
  flex: none;
  overflow: hidden;
  opacity: 1;
  /* One duration and one curve across all three, so the icons fade out at the
     rate the space closes rather than vanishing first and leaving a gap to
     shut behind them. */
  transition: max-width .42s cubic-bezier(.4, .02, .2, 1),
              opacity .42s cubic-bezier(.4, .02, .2, 1),
              margin-right .42s cubic-bezier(.4, .02, .2, 1);
}
/* Shut. The negative margin swallows the parent's gap, so a folded strip
   leaves no hole between Save and the button that unfolds it. */
.hd-strip.shut {
  opacity: 0;
  margin-right: -9px;
}
/* Restoring a remembered fold, rather than performing one. Somebody who folded
   this yesterday should find it folded, not watch it fold again every load. */
.hd-strip.nofx { transition: none; }

.hd-striptog {
  display: inline-grid;
  place-items: center;
  width: 26px;
  height: 26px;
  flex: none;
  padding: 0;
  border: 1px solid var(--strip-line);
  border-radius: 999px;
  background: none;
  color: var(--strip-ink3);
  font: inherit;
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
}
.hd-striptog:hover { color: var(--strip-ink); border-color: var(--strip-ink3); }
.hd-striptog:focus-visible { outline: 2px solid var(--strip-focus); outline-offset: 2px; }

/* The slide is the whole mechanism, so with motion off it simply is or is not
   there — no half-open frame anybody has to wait through. */
@media (prefers-reduced-motion: reduce) {
  .hd-strip { transition: none; }
}

   form an MRI / GWI / Nielsen cut arrives in — plus a short list of
   entity-level overrides for the cases where the category is too blunt.

   Replace `aff` with a real cut and the mockups become a real instrument
   without a line of UI changing. That is the whole point of keeping it here.  */

/* The rail is grouped, and the groups are not decoration — they say where a
   number came from, which is the one thing a planner has to know before
   trusting a board built on it.

               deliberately still drawn: a heading with nothing under it says
               "this is missing", where no heading at all says nothing.
     popular   the ones everybody reaches for. Estimated, and labelled.
     custom    whatever this browser defined. Never mixed with the others.

   Order matters beyond layout: ROSTER() is built in this order, so the
   fallback for a hash pointing at a deleted audience resolves to the most
   authoritative thing available rather than to whatever sorts first. */

       stage you are standing on — so it belongs to the group whose numbers

    color: '#1A67D2',
    empty: 'None loaded yet — the PA’s own cut goes here.'

   names are agreed and the cut has not landed. It matters because of how the
   score is built: a category an audience does not mention falls back to par at
   100, so an audience with no cut at all scores every moment identically to
   every other audience with no cut. It would look like a working audience
   switch and be nothing of the kind, which is the exact failure this tool
   exists to make impossible.

/* The twelve categories, gathered into five families for the board.

   Twelve lanes in a flat stack is twelve things to hold at once, when the
   reader is really asking one of five questions. The families are the answer
   to that, and they are drawing only — nothing scores at family level, nothing
   is filtered at family level, and a category belongs to exactly one of them.

   Order is sport first, culture last: the lanes people open the board for sit
   where the eye lands, and the civic year — which is mostly context rather
   than something to buy — sits under them. Families collapse, so a reader who
   works one family at a time can shut the rest.

   SPORT IS ITS OWN FAMILY on purpose, even at one category. It is the only
   category that is simultaneously the biggest lane on the board, appointment
